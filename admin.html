:root {
  --p: #5B3FD9; --pd: #4327B8; --ps: #EEEAFE; --bg: #F6F5FB; --ink: #1B1830; --mu: #5F5B73; --line: #E7E4F0;
  --gr: #1E7A45; --grs: #E3F4EA; --or: #A14A06; --ors: #FDF0E1; --rd: #B42318; --rds: #FDE8E6; --bl: #1D5FB8; --bls: #E4EEFB;
  --card: #FFFFFF; --chatbg: #F1EFF8;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: "Plus Jakarta Sans", "Noto Sans Khmer", system-ui, -apple-system, sans-serif; background: #E9E7F2; color: var(--ink); font-size: 15px; }
button, input, select, textarea { font-family: inherit; font-size: 15px; color: var(--ink); }
button { cursor: pointer; }
a { color: var(--p); }
svg { flex-shrink: 0; }
#root { max-width: 520px; margin: 0 auto; height: 100%; background: var(--bg); position: relative; display: flex; flex-direction: column; overflow: hidden; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.hidden { display: none !important; }

/* header */
.hdr { height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; background: #fff; border-bottom: 1px solid var(--line); }
.hdr.back { padding-left: 4px; }
.hdr .t { flex: 1; min-width: 0; }
.hdr .t b { display: block; font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .t small { display: block; font-size: 12px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }
.ib:active { background: var(--ps); }

/* tab bar */
.tabs { flex-shrink: 0; display: flex; background: #fff; border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs a { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 10px; text-decoration: none; color: var(--mu); font-size: 11px; font-weight: 600; }
.tabs a.on { color: var(--p); font-weight: 800; }
.badge { background: var(--rd); color: #fff; font-size: 10px; font-weight: 800; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; }
.tabs .badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; }

/* cards & lists */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card.flush { padding: 0; gap: 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: var(--ink); background: #fff; border: 0; width: 100%; text-align: left; }
.list-item > :last-child:not(.grow) { flex-shrink: 0; }
.list-item + .list-item { border-top: 1px solid var(--line); }
.list-item:active { background: #FAF9FD; }
.tt { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { font-size: 13px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.sec { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--mu); margin-top: 4px; }
.sec a, .sec button { font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: 0; text-decoration: none; background: none; border: 0; color: var(--p); padding: 0; }
.muted { color: var(--mu); }
.small { font-size: 13px; }
.big { font-size: 24px; font-weight: 800; }
.empty { text-align: center; color: var(--mu); padding: 32px 16px; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }

.av { width: 44px; height: 44px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
.av.sm { width: 32px; height: 32px; font-size: 12px; }
.ic-av { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--ps); color: var(--p); }
.ic-av.sq { border-radius: 12px; width: 40px; height: 40px; }

.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--ps); color: var(--p); }
.pill.gr { background: var(--grs); color: var(--gr); } .pill.or { background: var(--ors); color: var(--or); }
.pill.rd { background: var(--rds); color: var(--rd); } .pill.bl { background: var(--bls); color: var(--bl); }
.pill.gy { background: #EFEDF4; color: var(--mu); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-shrink: 0; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: #fff; white-space: nowrap; }
.chip.on { background: var(--p); color: #fff; border-color: var(--p); }

/* buttons & forms */
.btn { text-decoration: none; height: 48px; border-radius: 12px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--p); color: #fff; padding: 0 18px; }
.btn:active { background: var(--pd); }
.btn:disabled { opacity: .55; }
.btn.ghost { background: var(--ps); color: var(--pd); }
.btn.out { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.green { background: var(--gr); } .btn.red { background: #fff; color: var(--rd); border: 1px solid #F1C4BF; }
.btn.sm { height: 38px; font-size: 13px; padding: 0 12px; border-radius: 10px; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 10px; } .btns > * { flex: 1; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--mu); }
.inp { height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: #fff; width: 100%; outline: none; }
textarea.inp { height: 80px; padding: 12px 14px; resize: none; }
.inp:focus { border-color: var(--p); box-shadow: 0 0 0 3px var(--ps); }
.search { display: flex; align-items: center; gap: 8px; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; color: var(--mu); }
.search input { border: 0; outline: 0; flex: 1; font-size: 15px; background: transparent; min-width: 0; }
.seg { display: flex; gap: 8px; } .seg button { flex: 1; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 13px; }
.seg button.on { border: 2px solid var(--p); background: var(--ps); color: var(--pd); }
.qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; }
.qty button { width: 36px; height: 38px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.qty input { width: 44px; text-align: center; border: 0; font-weight: 800; font-size: 15px; outline: 0; background: transparent; }
.err { color: var(--rd); font-size: 13px; min-height: 18px; text-align: center; }

/* home */
.hero { background: var(--p); color: #fff; padding: 22px 20px 64px; flex-shrink: 0; }
.hero small { color: #E4DEFF; font-size: 14px; }
.hero h1 { margin: 2px 0 0; font-size: 22px; font-weight: 800; }
.lift { margin-top: -48px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 16px; }
.qa { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-size: 12px; font-weight: 700; text-align: center; border: 0; background: none; padding: 0; }
.qa span.i { width: 54px; height: 54px; border-radius: 16px; background: var(--ps); color: var(--p); display: flex; align-items: center; justify-content: center; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-size: 22px; font-weight: 800; }
.stat span { font-size: 12px; font-weight: 700; color: var(--mu); }

/* chat */
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--chatbg); }
.day { align-self: center; font-size: 12px; font-weight: 700; color: var(--mu); background: #fff; padding: 4px 12px; border-radius: 999px; }
.sys { align-self: center; font-size: 12px; color: var(--mu); background: #fff; padding: 5px 12px; border-radius: 999px; text-align: center; max-width: 90%; }
.m { display: flex; gap: 8px; align-items: flex-end; }
.m.me { justify-content: flex-end; }
.bub { max-width: 78%; background: #fff; border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 8px 12px; display: flex; flex-direction: column; gap: 3px; }
.m.me .bub { background: var(--ps); border-color: #DCD4FB; border-radius: 16px 16px 4px 16px; }
.bub .who { font-size: 12px; font-weight: 800; }
.bub .tx { font-size: 15px; line-height: 1.42; white-space: pre-wrap; word-wrap: break-word; }
.bub .tm { font-size: 11px; color: var(--mu); text-align: right; }
.bub img { max-width: 100%; border-radius: 10px; display: block; }
.ordcard { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; min-width: 210px; text-decoration: none; color: var(--ink); }
.composer { flex-shrink: 0; display: flex; gap: 6px; align-items: flex-end; padding: 8px 10px calc(10px + var(--safe-b)); background: #fff; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-height: 44px; max-height: 120px; border: 1px solid var(--line); border-radius: 22px; padding: 11px 16px; font-size: 15px; background: var(--bg); resize: none; outline: 0; }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--p); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.locked { flex-shrink: 0; display: flex; gap: 8px; align-items: center; justify-content: center; padding: 16px; background: #fff; border-top: 1px solid var(--line); font-size: 14px; color: var(--mu); }

/* order timeline */
.tl { display: flex; gap: 12px; }
.tl .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #C9C4DA; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tl.done .dot { background: var(--gr); border-color: var(--gr); color: #fff; }
.tl.now .dot { background: var(--p); border-color: var(--p); }
.tl.now .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.tl .line { width: 2px; flex: 1; background: var(--line); min-height: 18px; margin: 2px auto 0; }
.tl.done .line { background: var(--gr); }
.tl .body { padding-bottom: 12px; }
.bar { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.bar > div { height: 100%; border-radius: 4px; }

/* sheet, toast, login */
.overlay { position: absolute; inset: 0; background: rgba(20, 16, 40, .45); display: flex; align-items: flex-end; z-index: 70; }
.sheet { background: #fff; width: 100%; max-height: 88%; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet .sh { display: flex; align-items: center; padding: 14px 8px 8px 18px; font-size: 17px; font-weight: 800; }
.sheet .sh span { flex: 1; }
.sheet .sb { overflow-y: auto; padding: 4px 18px calc(18px + var(--safe-b)); display: flex; flex-direction: column; gap: 12px; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 80; max-width: 88%; text-align: center; }
.login { flex: 1; display: flex; flex-direction: column; background: var(--p); overflow-y: auto; }
.login .top { padding: 56px 28px 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #fff; text-align: center; }
.login .logo { width: 80px; height: 80px; border-radius: 24px; background: #fff; color: var(--p); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 800; }
.login .panel { flex: 1; background: #fff; border-radius: 28px 28px 0 0; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; }
.demo-note { background: var(--ors); color: var(--or); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.45; }
.photo-box { height: 150px; border-radius: 14px; border: 2px dashed #CFC8EA; background: var(--bg); color: var(--pd); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 14px; overflow: hidden; width: 100%; }
.photo-box img { width: 100%; height: 100%; object-fit: cover; }
.spin { width: 22px; height: 22px; border: 3px solid var(--ps); border-top-color: var(--p); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.loading { display: flex; justify-content: center; padding: 30px; }

/* ---------- admin panel ---------- */
#root.admin-root { max-width: none; }
.adm { display: flex; height: 100%; position: relative; overflow: hidden; }
.side { width: 248px; flex-shrink: 0; background: var(--ink); color: #fff; display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; z-index: 60; }
.side .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.side .brand small, .side .me small { display: block; color: #B9B4CC; font-size: 12px; }
.logo-sm { width: 38px; height: 38px; border-radius: 11px; background: var(--p); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
.side nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.side nav a { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-radius: 10px; color: #CFCADF; text-decoration: none; font-weight: 700; font-size: 14px; }
.side nav a.on { background: var(--p); color: #fff; }
.side nav a .badge { margin-left: auto; font-style: normal; background: #fff; color: var(--p); }
.side .me { display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,.12); padding: 12px 4px 0; font-size: 14px; }
.scrim { display: none; }
.amain { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.ahdr { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); }
.ahdr .t { flex: 1; min-width: 0; }
.ahdr .t b { display: block; font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ahdr .t small { display: block; font-size: 12px; color: var(--mu); }
.ahdr .menu { display: none; margin-left: -8px; }
.apad { padding: 18px; display: flex; flex-direction: column; gap: 14px; max-width: 1280px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpis .stat b { font-size: 21px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.agrid .wide { grid-column: 1 / -1; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters .search { min-width: 200px; }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 180px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.bars > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.bars em { font-style: normal; font-size: 10px; color: var(--mu); font-variant-numeric: tabular-nums; }
.bars i { width: 100%; max-width: 44px; border-radius: 6px 6px 0 0; display: block; }
.bars span { font-size: 11px; color: var(--mu); margin-bottom: -20px; height: 16px; }
.bars { margin-bottom: 20px; }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 12px; color: var(--mu); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: 0; }
@media (max-width: 860px) {
  .side { position: absolute; top: 0; bottom: 0; left: 0; transform: translateX(-105%); transition: transform .2s; }
  .side.open { transform: none; }
  .scrim.open { display: block; position: absolute; inset: 0; background: rgba(20,16,40,.45); z-index: 55; }
  .ahdr .menu { display: inline-flex; }
  .apad { padding: 14px; }
  .hide-sm { display: none !important; }
  .agrid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* expenses */
.catgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.catgrid button { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink); }
.catgrid button.on { border: 2px solid var(--p); background: var(--ps); }
.catgrid button:disabled { opacity: .6; }
.dayhead { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--mu); padding: 10px 14px 6px; background: var(--bg); }
.sheet .sb > * { flex-shrink: 0; }

/* roles & permissions grid */
.pgrid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 64px); align-items: center; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--line); }
.pgrid.phead { position: sticky; top: 0; background: #fff; z-index: 2; border-top: 0; font-size: 11px; font-weight: 800; color: var(--mu); text-transform: uppercase; letter-spacing: .03em; }
.pgrid.phead span:not(:first-child) { text-align: center; }
.pgroup { background: var(--bg); padding: 8px 12px; font-size: 12px; font-weight: 800; color: var(--p); text-transform: uppercase; letter-spacing: .05em; border-top: 1px solid var(--line); }
.plabel { font-weight: 700; font-size: 14px; }
.pcell { display: flex; justify-content: center; align-items: center; min-height: 44px; cursor: pointer; }
.pcell input { width: 24px; height: 24px; accent-color: var(--p); cursor: pointer; }
@media (max-width: 480px) { .pgrid { grid-template-columns: minmax(0, 1fr) repeat(4, 48px); padding: 8px 8px; } .pgrid.phead { font-size: 9.5px; } }

.seg.wrap { flex-wrap: wrap; } .seg.wrap button { flex: 1 0 30%; min-width: 0; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paybar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; } .paybar > div { height: 100%; background: var(--gr); border-radius: 99px; }
.btns > .f { min-width: 0; flex: 1 1 0; } input[type=date].inp { min-width: 0; width: 100%; -webkit-appearance: none; appearance: none; }
.pchips { display: flex; gap: 8px; flex-wrap: wrap; } .pchips .chip { display: inline-flex; align-items: center; gap: 4px; }
.pchips .chip svg { flex-shrink: 0; }
.pcustom { gap: 10px; }

/* order lines with editable price */
.oline { padding: 10px 0; border-top: 1px solid var(--line); }
.pricebox { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; height: 40px; background: var(--card, #fff); }
.pricebox span { color: var(--mu); font-weight: 700; }
.pricebox input { width: 64px; border: 0; outline: 0; font-weight: 800; font-size: 15px; background: transparent; }
.pricebox.chg { border-color: var(--or); background: #FFF6EC; }
.linkbtn { border: 0; background: none; color: var(--p); font-weight: 700; font-size: 13px; padding: 6px 0 0; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
</style>

<script>// The list of everything that can be switched on/off per role (and per person).
// Defaults match the database script. The admin always has everything.
window.KT_PERMS = [
  { group: 'Orders', items: [
    ['orders.create', 'Create orders'],
    ['orders.view_all', 'See everyone\'s orders', 'Off = only their own orders'],
    ['orders.approve', 'Approve orders'],
    ['orders.deliver', 'Mark orders delivered'],
    ['orders.paid', 'Mark orders paid'],
    ['orders.cancel', 'Cancel approved orders', 'Goods go back into stock'],
    ['orders.edit_any', 'Edit or delete other people\'s waiting orders']] },
  { group: 'Payments / debt', items: [
    ['payments.collect', 'Staff can collect payments from shops', 'Off by default. Waits for confirmation'],
    ['payments.confirm', 'Confirm payments', 'Also: their own payments count straight away']] },
  { group: 'Shops / customers', items: [
    ['customers.view_all', 'See all shops', 'Off = only shops assigned to them'],
    ['customers.create', 'Add new shops', 'New shops wait for approval'],
    ['customers.approve', 'Approve new shops'],
    ['customers.manage', 'Edit approved shops and change sales rep'],
    ['customers.delete', 'Delete shops']] },
  { group: 'Stock', items: [
    ['stock.manage', 'Stock in/out, products and prices']] },
  { group: 'Suppliers & purchases', items: [
    ['purchases.manage', 'Suppliers, purchases and paying suppliers', 'Also sees cost prices and profit'],
    ['purchases.receive', 'Receive goods from suppliers', 'Adds the goods into stock']] },
  { group: 'Shop visits', items: [
    ['visits.create', 'Check in at shops'],
    ['visits.view_all', 'See all staff visits']] },
  { group: 'Expenses', items: [
    ['expenses.create', 'Write down own expenses'],
    ['expenses.approve', 'Approve and pay back expenses'],
    ['expenses.record_others', 'Write down expenses for other staff']] },
  { group: 'HR & attendance', items: [
    ['attendance.view', 'See everyone\'s attendance and leave'],
    ['hr.manage', 'Staff details, salary, leave approval, commission', 'Sensitive: salary']] },
  { group: 'Chat', items: [
    ['chat.announce', 'Post in the announcements channel'],
    ['chat.create_group', 'Create chat groups']] },
  { group: 'Admin panel', items: [
    ['dashboard.view', 'Open the admin panel and dashboard'],
    ['reports.view', 'See reports']] }
];
window.KT_PERM_KEYS = window.KT_PERMS.flatMap(g => g.items.map(i => i[0]));
window.KT_PERM_DEFAULTS = {
  manager: ['orders.create', 'orders.view_all', 'orders.approve', 'orders.deliver', 'orders.paid', 'orders.cancel', 'orders.edit_any', 'customers.view_all', 'customers.create',
    'customers.approve', 'customers.manage', 'stock.manage', 'visits.create', 'visits.view_all', 'expenses.create', 'expenses.approve', 'expenses.record_others',
    'chat.announce', 'chat.create_group', 'dashboard.view', 'reports.view', 'payments.collect', 'payments.confirm', 'purchases.manage', 'purchases.receive', 'attendance.view'],
  sales: ['orders.create', 'customers.create', 'visits.create', 'expenses.create', 'chat.create_group'],
  warehouse: ['orders.view_all', 'orders.deliver', 'customers.view_all', 'stock.manage', 'expenses.create', 'chat.create_group', 'purchases.receive'],
  driver: ['orders.view_all', 'orders.deliver', 'customers.view_all', 'expenses.create', 'chat.create_group']
};

// Real backend: talks to your Supabase project.
window.makeSupabaseApi = function (cfg) {
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  const toEmail = u => String(u).trim().toLowerCase() + '@' + cfg.STAFF_EMAIL_DOMAIN;
  async function q(promise) {
    const { data, error } = await promise;
    if (error) throw new Error(error.message);
    return data;
  }
  let me = null;
  const PAY_SEL = '*, orders(order_no, total, paid_amount, status), customers(name, province, assigned_to), receiver:profiles!payments_received_by_fkey(full_name), confirmer:profiles!payments_confirmed_by_fkey(full_name)';

  async function loadProfile(userId) {
    me = await q(sb.from('profiles').select('*').eq('id', userId).maybeSingle());
    if (me) me.perms = me.active ? await q(sb.rpc('my_permissions')) : [];
    return me;
  }

  async function compressImage(file, maxSide = 1280) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file);
    });
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
  }

  const api = {
    mode: 'live',
    async session() {
      const { data } = await sb.auth.getSession();
      if (!data.session) return null;
      return loadProfile(data.session.user.id);
    },
    async login(username, password) {
      const data = await q(sb.auth.signInWithPassword({ email: toEmail(username), password }));
      return loadProfile(data.user.id);
    },
    async signup(fullName, username, password) {
      const data = await q(sb.auth.signUp({
        email: toEmail(username), password,
        options: { data: { username: String(username).trim().toLowerCase(), full_name: fullName } }
      }));
      if (!data.session) throw new Error('Account created, but email confirmation is still on in Supabase. Turn off "Confirm email" (see setup steps), then log in.');
      return loadProfile(data.user.id);
    },
    async logout() { await sb.auth.signOut(); me = null; },
    me: () => me,
    refreshMe: () => me ? loadProfile(me.id) : null,

    // staff
    listStaff: () => q(sb.from('profiles').select('*').order('active', { ascending: true }).order('full_name')),
    updateStaff: (id, role, active, fullName, phone) => q(sb.rpc('admin_update_staff', { p_id: id, p_role: role, p_active: active, p_full_name: fullName || null, p_phone: phone === undefined ? null : (phone || '') })),

    // stock
    listWarehouses: () => q(sb.from('warehouses').select('*').order('id')),
    async listProducts() {
      const [products, stock] = await Promise.all([
        q(sb.from('products').select('*').eq('active', true).order('name')),
        q(sb.from('stock').select('*'))
      ]);
      return products.map(p => {
        const byWh = {}; let total = 0;
        stock.filter(s => s.product_id === p.id).forEach(s => { byWh[s.warehouse_id] = s.qty; total += s.qty; });
        return Object.assign({}, p, { stock: byWh, total_qty: total });
      });
    },
    async saveProduct(p) {
      const row = { sku: p.sku, name: p.name, category: p.category || 'General', price: +p.price || 0, cost: +p.cost || 0, min_stock: +p.min_stock || 0 };
      if (p.id) return q(sb.from('products').update(row).eq('id', p.id).select().single());
      return q(sb.from('products').insert(row).select().single());
    },
    adjustStock: (pid, wid, change, reason, note) => q(sb.rpc('adjust_stock', { p_product: pid, p_warehouse: wid, p_change: change, p_reason: reason, p_note: note || null })),
    transferStock: (pid, from, to, qty) => q(sb.rpc('transfer_stock', { p_product: pid, p_from: from, p_to: to, p_qty: qty })),
    productMoves: pid => q(sb.from('stock_moves').select('*, profiles(full_name), warehouses(name)').eq('product_id', pid).order('id', { ascending: false }).limit(50)),

    // customers
    listCustomers: () => q(sb.rpc('list_customers')),
    async saveCustomer(c) {
      const row = { name: c.name, owner_name: c.owner_name || null, phone: c.phone || null, address: c.address || null, area: c.area || null,
        lat: c.lat ?? null, lng: c.lng ?? null, price_level: c.price_level || 'Retail', credit_days: +c.credit_days || 0, notes: c.notes || null, province: c.province || null, map_url: c.map_url || null };
      const mgr = me && (me.role === 'admin' || (me.perms || []).includes('customers.manage'));
      if (c.assigned_to !== undefined && mgr) row.assigned_to = c.assigned_to || null;
      if (c.credit_limit !== undefined && mgr) row.credit_limit = +c.credit_limit || 0;
      if (c.id) return q(sb.from('customers').update(row).eq('id', c.id).select().single());
      return q(sb.from('customers').insert(row).select().single());
    },

    reviewCustomer: (id, status, note) => q(sb.rpc('review_customer', { p_id: id, p_status: status, p_note: note || null })),
    setCustomerLocation: (id, lat, lng) => q(sb.rpc('set_customer_location', { p_id: id, p_lat: lat, p_lng: lng })),
    async deleteCustomer(id) {
      const { data, error } = await sb.from('customers').delete().eq('id', id).select('id');
      if (error) throw new Error(/foreign key/i.test(error.message) ? 'This shop has orders or visits, so it cannot be deleted.' : error.message);
      if (!data || !data.length) throw new Error('You cannot delete this shop');
    },
    updateOrder: (id, o) => q(sb.rpc('update_order', { p_order: id, p_payment: o.payment_method, p_notes: o.notes || null, p_items: o.items })),
    deleteOrder: id => q(sb.rpc('delete_order', { p_order: id })),
    assignCustomers: (ids, rep) => q(sb.rpc('assign_customers', { p_ids: ids, p_rep: rep || null })),

    // orders
    async listOrders(limit) {
      return q(sb.from('orders').select('*, customers(name, area), creator:profiles!orders_created_by_fkey(full_name), rep:profiles!orders_sales_rep_id_fkey(full_name)').order('id', { ascending: false }).limit(limit || 3000));
    },
    listOrderItems: () => q(sb.from('order_items').select('order_id, product_id, qty, price, cost, products(name, sku)').order('id', { ascending: false }).limit(10000)),
    async getOrder(id) {
      const [order, items, events, conv, payments] = await Promise.all([
        q(sb.from('orders').select('*, customers(*), creator:profiles!orders_created_by_fkey(full_name), rep:profiles!orders_sales_rep_id_fkey(full_name)').eq('id', id).single()),
        q(sb.from('order_items').select('*, products(name, sku, price)').eq('order_id', id).order('id')),
        q(sb.from('order_events').select('*, profiles(full_name)').eq('order_id', id).order('id')),
        q(sb.from('conversations').select('id').eq('order_id', id).maybeSingle()),
        q(sb.from('payments').select(PAY_SEL).eq('order_id', id).order('id'))
      ]);
      return Object.assign(order, { items, events, payments, conversation_id: conv && conv.id });
    },
    createOrder: o => q(sb.rpc('create_order', { p_customer: o.customer_id, p_warehouse: o.warehouse_id, p_payment: o.payment_method, p_notes: o.notes || null, p_items: o.items })),
    setOrderStatus: (id, status, note) => q(sb.rpc('set_order_status', { p_order: id, p_status: status, p_note: note || null })),

    // visits
    listVisits: () => q(sb.from('visits').select('*, customers(name, area), profiles(full_name)').order('id', { ascending: false }).limit(200)),
    activeVisit: () => me ? q(sb.from('visits').select('*, customers(*)').eq('staff_id', me.id).is('check_out_at', null).order('id', { ascending: false }).limit(1).maybeSingle()) : null,
    async checkIn(v) {
      const photo_url = v.photo ? await api.uploadPhoto(v.photo, 'visits') : null;
      return q(sb.from('visits').insert({ customer_id: v.customer_id, staff_id: me.id, lat: v.lat, lng: v.lng, distance_m: v.distance_m, photo_url, notes: v.notes || null }).select().single());
    },
    checkOut: (id, notes) => q(sb.from('visits').update({ check_out_at: new Date().toISOString(), notes: notes || null }).eq('id', id)),

    // chat
    listConversations: () => q(sb.rpc('my_conversations')),
    async listMessages(convId, beforeId) {
      let query = sb.from('messages').select('*').eq('conversation_id', convId).order('id', { ascending: false }).limit(60);
      if (beforeId) query = query.lt('id', beforeId);
      return (await q(query)).reverse();
    },
    sendMessage: (convId, body, kind, meta) => q(sb.rpc('send_message', { p_conv: convId, p_body: body || '', p_kind: kind || 'text', p_meta: meta || {} })),
    async sendImage(convId, file) {
      const url = await api.uploadPhoto(file, 'chat');
      return api.sendMessage(convId, '', 'image', { url });
    },
    markRead: convId => q(sb.rpc('mark_read', { p_conv: convId })),
    directWith: userId => q(sb.rpc('get_or_create_direct', { p_other: userId })),
    createGroup: (title, ids) => q(sb.rpc('create_group', { p_title: title, p_members: ids })),
    subscribe(onMessage, onOrder) {
      const ch = sb.channel('live-' + Date.now())
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => onMessage(p.new))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, p => onOrder && onOrder(p.new))
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, p => api.onNotify && me && p.new.user_id === me.id && api.onNotify(p.new))
        .subscribe();
      return () => sb.removeChannel(ch);
    },

    dashboard: () => q(sb.rpc('dashboard_stats')),
    myDashboard: () => q(sb.rpc('my_dashboard')),

    // settings (company info, commission, work hours)
    async getSettings() { const rows = await q(sb.from('app_settings').select('key, value')); const o = {}; rows.forEach(r => { o[r.key] = r.value; }); return o; },
    saveSettings: obj => q(sb.rpc('save_settings', { p: obj })),

    // commission
    commissionReport: month => q(sb.rpc('commission_report', { p_month: month })),
    listCommissionRates: () => q(sb.from('commission_rates').select('*')),
    setCommissionRate: (uid, rate) => q(sb.rpc('set_commission_rate', { p_user: uid, p_rate: rate === '' || rate == null ? null : +rate })),

    // attendance, leave, HR
    listAttendance: (from, to) => q(sb.from('attendance').select('*, profiles(full_name)').gte('work_date', from).lte('work_date', to).order('work_date', { ascending: false }).limit(5000)),
    async todayAttendance() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return q(sb.from('attendance').select('*').eq('staff_id', me.id).eq('work_date', d.toISOString().slice(0, 10)).maybeSingle()); },
    async clockIn(lat, lng, photo, note) { const url = photo ? await api.uploadPhoto(photo, 'attendance') : null; return q(sb.rpc('clock_in', { p_lat: lat, p_lng: lng, p_photo: url, p_note: note || null })); },
    clockOut: (lat, lng, note) => q(sb.rpc('clock_out', { p_lat: lat, p_lng: lng, p_note: note || null })),
    listLeave: () => q(sb.from('leave_requests').select('*, profiles!leave_requests_staff_id_fkey(full_name)').order('id', { ascending: false }).limit(2000)),
    askLeave: x => q(sb.from('leave_requests').insert({ staff_id: me.id, kind: x.kind, from_date: x.from_date, to_date: x.to_date, days: +x.days, reason: x.reason || null }).select().single()),
    deleteLeave: id => q(sb.from('leave_requests').delete().eq('id', id)),
    reviewLeave: (id, status, note) => q(sb.rpc('review_leave', { p_id: id, p_status: status, p_note: note || null })),
    listStaffHr: () => q(sb.from('staff_hr').select('*')),
    async saveStaffHr(x) { return q(sb.from('staff_hr').upsert({ user_id: x.user_id, position: x.position || null, start_date: x.start_date || null, base_salary: +x.base_salary || 0, annual_leave_days: +x.annual_leave_days || 0, emergency_contact: x.emergency_contact || null, notes: x.notes || null, gender: x.gender || null, birth_date: x.birth_date || null, address: x.address || null, id_card: x.id_card || null, bank_account: x.bank_account || null }).select().single()); },

    // notifications
    listNotifications: () => q(sb.from('notifications').select('*').eq('kind', 'info').order('id', { ascending: false }).limit(60)),
    markNotificationsRead: () => q(sb.rpc('mark_notifications_read')),
    async savePushSubscription(sub) { const j = sub.toJSON(); return q(sb.from('push_subscriptions').upsert({ user_id: me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' })); },

      if (x.id) return q(sb.from('suppliers').update(row).eq('id', x.id).select().single());
      return q(sb.from('suppliers').insert(row).select().single());
    },
    listPurchases: () => q(sb.from('purchases').select('*, suppliers(name, country), warehouses(name)').order('id', { ascending: false }).limit(3000)),
    listPurchaseItems: () => q(sb.from('purchase_items').select('*, products(name, sku)').order('id', { ascending: false }).limit(20000)),
    async getPurchase(id) {
      const [p, items, pays] = await Promise.all([
        q(sb.from('purchases').select('*, suppliers(*), warehouses(name), creator:profiles!purchases_created_by_fkey(full_name), receiver:profiles!purchases_received_by_fkey(full_name)').eq('id', id).single()),

        q(sb.from('supplier_payments').select('*').eq('purchase_id', id).order('id'))]);
      return Object.assign(p, { items, payments: pays });
    },
    createPurchase: x => q(sb.rpc('create_purchase', { p_supplier: x.supplier_id, p_warehouse: x.warehouse_id, p_currency: x.currency, p_rate: +x.rate || 1, p_extra: +x.extra_cost || 0, p_note: x.note || null, p_items: x.items, p_receive: !!x.receive, p_ordered_on: x.ordered_on || null })),

    setSalesTarget: (uid, month, amount) => q(sb.rpc('set_sales_target', { p_user: uid, p_month: month, p_amount: +amount || 0 })),

    listPayments: () => q(sb.from('payments').select(PAY_SEL).order('id', { ascending: false }).limit(3000)),

    },
    deleteExpense: id => q(sb.from('expenses').delete().eq('id', id)),
    reviewExpense: (id, status, note) => q(sb.rpc('review_expense', { p_id: id, p_status: status, p_note: note || null })),
    async getKhrRate() { const r = await q(sb.from('app_settings').select('value').eq('key', 'khr_per_usd').maybeSingle()); return r ? +r.value : 4100; },
    setKhrRate: rate => q(sb.rpc('set_khr_rate', { p_rate: rate })),

    async uploadPhoto(file, folder) {
      const blob = await compressImage(file);
      const path = folder + '/' + me.id + '/' + Date.now() + '.jpg';
      await q(sb.storage.from('files').upload(path, blob, { contentType: 'image/jpeg' }));
      return sb.storage.from('files').getPublicUrl(path).data.publicUrl;
    }
  };
  return api;
};

      let total = 0; o.items.forEach(it => { const p = D.products.find(x => x.id === it.product_id), pr = priceFor(p, it); D.items.push({ id: ++D.seq.item, order_id: id, product_id: p.id, qty: it.qty, price: pr, cost: p.cost }); total += pr * it.qty; });

    async createOrder(o) {
      if (!role()) fail('Your account is not active');
      if (!allow('orders.create')) fail('You are not allowed to create orders');
      if (!allow('customers.view_all') && (D.customers.find(c => c.id === o.customer_id) || {}).assigned_to !== me.id) fail('This shop belongs to another sales rep');
      if ((D.customers.find(c => c.id === o.customer_id) || {}).status !== 'approved') fail('This shop is waiting for admin approval. You can order after it is approved.');
      if (!o.items || !o.items.length) fail('Add at least one product');
      const wh = D.warehouses.find(w => w.id === o.warehouse_id);
      if (wh && wh.rep_id && wh.rep_id !== me.id && !allow('stock.manage')) fail('You can only sell from your own stock or the main warehouse');
      let pre = 0; o.items.forEach(it => { const p = D.products.find(x => x.id === it.product_id); if (p) pre += priceFor(p, it) * it.qty; });
      checkCredit(o.customer_id, pre, null);
      const autoOk = allow('orders.approve');
      if (autoOk) { const need = {}; o.items.forEach(it => { need[it.product_id] = (need[it.product_id] || 0) + it.qty; });
        Object.keys(need).forEach(pid => { if (qty(+pid, o.warehouse_id) < need[pid]) fail('Not enough stock for ' + D.products.find(p => p.id === +pid).name); }); }
      const id = ++D.seq.order, order_no = 'SO-' + String(id).padStart(5, '0');
      let total = 0;
      o.items.forEach(it => { const p = D.products.find(x => x.id === it.product_id); if (!p) fail('Product not found'); if (it.qty <= 0) fail('Quantity must be more than 0');
        const pr = priceFor(p, it); D.items.push({ id: ++D.seq.item, order_id: id, product_id: p.id, qty: it.qty, price: pr, cost: p.cost }); total += pr * it.qty; });
      const order = { id, order_no, customer_id: o.customer_id, warehouse_id: o.warehouse_id, status: 'pending', payment_method: o.payment_method, total: +total.toFixed(2), paid_amount: 0, delivered_at: null, notes: o.notes || '', created_by: me.id, sales_rep_id: (D.customers.find(c => c.id === o.customer_id) || {}).assigned_to || me.id, approved_by: null, created_at: now(), updated_at: now() };
      D.orders.push(order);
      D.events.push({ id: ++D.seq.event, order_id: id, status: 'pending', note: null, created_by: me.id, created_at: now() });
      const c = { id: ++D.seq.conv, kind: 'order', title: order_no, slug: null, order_id: id, created_by: me.id, created_at: now(), last_message_at: now() };
      D.convs.push(c);
      D.users.filter(u => u.active && (u.id === me.id || u.id === order.sales_rep_id || ['admin', 'manager', 'warehouse'].includes(u.role))).forEach(u => D.members.push({ conversation_id: c.id, user_id: u.id, last_read_at: now() }));
      alert('New order ' + order_no + ' · ' + D.customers.find(x => x.id === o.customer_id).name + ' · $' + total.toFixed(2), { order_id: id });
      save(); notifyOrder(order);
      if (autoOk) await api.setOrderStatus(id, 'approved', 'Approved automatically');
      else notifyPerm('orders.approve', 'New order to approve', order_no + ' · ' + D.customers.find(x => x.id === o.customer_id).name + ' · $' + total.toFixed(2), '#/orders/' + id);
      if (order.sales_rep_id !== me.id) notify(order.sales_rep_id, 'New order for your shop', order_no + ' · ' + D.customers.find(x => x.id === o.customer_id).name, '#/orders/' + id);
      return wait(id);
    },
    async setOrderStatus(id, status, note) {
      const o = D.orders.find(x => x.id === id); const r = role();
      if (!canSeeOrder(o)) fail('Order not found');
      const ok = (o.status === 'pending' && status === 'approved' && allow('orders.approve'))
        || (o.status === 'pending' && status === 'cancelled' && (allow('orders.edit_any') || o.created_by === me.id))
        || (o.status === 'approved' && status === 'delivered' && (allow('orders.deliver') || (o.created_by === me.id && D.warehouses.some(w => w.id === o.warehouse_id && w.rep_id === me.id))))
        || (o.status === 'delivered' && status === 'paid' && allow('orders.paid'))
        || (o.status === 'approved' && status === 'cancelled' && allow('orders.cancel'));
      if (!ok) fail('You cannot change this order from ' + o.status + ' to ' + status);
      if (status === 'cancelled' && ((o.paid_amount || 0) > 0 || D.payments.some(p => p.order_id === id && p.status === 'pending'))) fail('This order already has payments. Reject those payments first, then cancel.');
      const lines = {}; D.items.filter(i => i.order_id === id).forEach(i => { lines[i.product_id] = (lines[i.product_id] || 0) + i.qty; });
      if (status === 'approved') {
        Object.keys(lines).forEach(pid => { if (qty(+pid, o.warehouse_id) < lines[pid]) fail('Not enough stock for ' + D.products.find(p => p.id === +pid).name); });
        Object.keys(lines).forEach(pid => { const b = qty(+pid, o.warehouse_id); setQty(+pid, o.warehouse_id, b - lines[pid]);
          D.moves.push({ id: ++D.seq.move, product_id: +pid, warehouse_id: o.warehouse_id, qty_change: -lines[pid], reason: 'order', ref: o.order_no, created_by: me.id, created_at: now() });
          checkLow(+pid, b, b - lines[pid]); });
        o.approved_by = me.id;
      } else if (status === 'cancelled' && o.status === 'approved') {
        Object.keys(lines).forEach(pid => { setQty(+pid, o.warehouse_id, qty(+pid, o.warehouse_id) + lines[pid]);
          D.moves.push({ id: ++D.seq.move, product_id: +pid, warehouse_id: o.warehouse_id, qty_change: lines[pid], reason: 'cancel', ref: o.order_no, created_by: me.id, created_at: now() }); });
      }
      if (status === 'paid' && D.payments.some(p => p.order_id === id && p.status === 'pending')) fail('Some payments for this order are waiting for check. Confirm or reject them first.');
      if (status === 'paid' && o.total > (o.paid_amount || 0)) {
        const rest = +(o.total - (o.paid_amount || 0)).toFixed(2);
        D.payments.push({ id: ++D.seq.payment, order_id: id, customer_id: o.customer_id, amount: rest, currency: 'USD', amount_usd: rest, method: 'other', note: note || 'Marked as paid', photo_url: null,
          status: 'confirmed', received_by: me.id, received_at: now(), confirmed_by: me.id, confirmed_at: now() });
        o.paid_amount = o.total;
      }
      o.status = status; o.updated_at = now(); if (status === 'delivered') o.delivered_at = now();
      D.events.push({ id: ++D.seq.event, order_id: id, status, note: note || null, created_by: me.id, created_at: now() });
      const c = D.convs.find(x => x.order_id === id);
      if (!isMember(c.id, me.id)) D.members.push({ conversation_id: c.id, user_id: me.id, last_read_at: now() });
      pushMessage(c.id, null, 'system', o.order_no + ' ' + status + ' by ' + me.full_name, { order_id: id, status });
      alert(o.order_no + ' is now ' + status, { order_id: id });
      if (status === 'delivered') recalc(id);
      { const shop = D.customers.find(x => x.id === o.customer_id).name, l = '#/orders/' + id;
        notify(o.sales_rep_id, o.order_no + ' ' + (status === 'paid' ? 'fully paid' : status), shop, l);
        if (o.created_by !== o.sales_rep_id) notify(o.created_by, o.order_no + ' ' + status, shop, l);
        if (status === 'approved') notifyPerm('orders.deliver', 'Order to deliver', o.order_no + ' · ' + shop, l); }
      save(); notifyOrder(o); return wait(null);
    },

    async addPayment(p) {

      D.payments.push(row);

      if (auto) recalc(o.id); else { alert('Payment $' + usd.toFixed(2) + ' for ' + o.order_no + ' waits for confirmation', { order_id: o.id }); notifyPerm('payments.confirm', 'Payment to check', '$' + usd.toFixed(2) + ' · ' + o.order_no, '#/payments?t=check'); }

    async dashboard() {

      const sold = D.orders.filter(o => !['pending', 'cancelled'].includes(o.status));
      const last7 = [];
      for (let i = 6; i >= 0; i--) { const d = new Date(Date.now() - i * 86400000); last7.push({ day: d.toISOString().slice(0, 10), total: sold.filter(o => day(o.created_at) === d.toDateString()).reduce((s, o) => s + o.total, 0) }); }
      const byStaff = {}; sold.forEach(o => { const n = user(o.sales_rep_id || o.created_by).full_name; byStaff[n] = (byStaff[n] || 0) + o.total; });
      return wait({

    // ---------- suppliers and purchases ----------
    async listSuppliers() { if (!(allow('purchases.manage') || allow('purchases.receive'))) return []; return wait(clone(D.suppliers).sort((a, b) => a.name.localeCompare(b.name))); },
    async saveSupplier(x) {
      if (!allow('purchases.manage')) fail('You are not allowed to change suppliers');
      if (!String(x.name || '').trim()) fail('Enter the supplier name');
      const row = { name: x.name.trim(), contact_name: x.contact_name || null, phone: x.phone || null, telegram: x.telegram || null, country: x.country || null, currency: x.currency || 'USD', notes: x.notes || null, active: x.active !== false };
      let out; if (x.id) out = Object.assign(D.suppliers.find(s => s.id === x.id), row); else { out = Object.assign({ id: Math.max(0, ...D.suppliers.map(s => s.id)) + 1, created_at: now() }, row); D.suppliers.push(out); }

    async getPurchase(id) {
      const p = D.purchases.find(x => x.id === id); if (!p || !(allow('purchases.manage') || allow('purchases.receive'))) fail('Purchase not found');
      return wait(Object.assign(clone(p), { suppliers: clone(D.suppliers.find(s => s.id === p.supplier_id)), warehouses: { name: D.warehouses.find(w => w.id === p.warehouse_id).name },
        creator: { full_name: (user(p.created_by) || {}).full_name }, receiver: p.received_by ? { full_name: (user(p.received_by) || {}).full_name } : null,

        payments: allow('purchases.manage') ? clone(D.spays.filter(x => x.purchase_id === id)) : [] }));
    },
    async createPurchase(x) {
      if (!allow('purchases.manage')) fail('You are not allowed to make purchases');
      if (!x.items || !x.items.length) fail('Add at least one product');
      const rate = x.currency === 'USD' || !x.currency ? 1 : Math.max(0.0001, +x.rate || 1), extra = Math.max(0, +x.extra_cost || 0);
      const id = Math.max(0, ...D.purchases.map(p => p.id)) + 1; let goods = 0;
      x.items.forEach(it => { if (!(it.qty > 0)) fail('Quantity must be more than 0'); goods += it.qty * (+it.unit_cost || 0) / rate; });
      const pcs = x.items.reduce((s, it) => s + it.qty, 0);
      x.items.forEach(it => D.pitems.push({ id: ++D.seq.pitem, purchase_id: id, product_id: it.product_id, qty: it.qty, unit_cost: +it.unit_cost || 0,
        landed_cost: +((+it.unit_cost || 0) / rate + (goods > 0 ? extra * ((+it.unit_cost || 0) / rate) / goods : extra / pcs)).toFixed(4) }));
      D.purchases.push({ id, purchase_no: 'PO-' + String(id).padStart(5, '0'), supplier_id: x.supplier_id, warehouse_id: x.warehouse_id, status: 'ordered', currency: x.currency || 'USD', rate, extra_cost: extra,
        total: +(goods + extra).toFixed(2), paid_amount: 0, note: x.note || '', ordered_on: x.ordered_on || localDay(now()), received_at: null, created_by: me.id, received_by: null, created_at: now() });
      save(); if (x.receive) await api.receivePurchase(id); return wait(id);
    },
    async receivePurchase(id) {
      if (!(allow('purchases.receive') || allow('purchases.manage'))) fail('You are not allowed to receive goods');
      const p = D.purchases.find(x => x.id === id); if (!p) fail('Purchase not found'); if (p.status !== 'ordered') fail('This purchase is already ' + p.status);
      const sup = D.suppliers.find(s => s.id === p.supplier_id);
      D.pitems.filter(i => i.purchase_id === id).forEach(i => {
        const pr = D.products.find(x => x.id === i.product_id), have = Math.max(0, D.warehouses.reduce((s, w) => s + qty(pr.id, w.id), 0));
        pr.cost = +((have * pr.cost + i.qty * i.landed_cost) / (have + i.qty)).toFixed(2);
        setQty(pr.id, p.warehouse_id, qty(pr.id, p.warehouse_id) + i.qty);
        D.moves.push({ id: ++D.seq.move, product_id: pr.id, warehouse_id: p.warehouse_id, qty_change: i.qty, reason: 'in', ref: p.purchase_no, note: 'From ' + sup.name, created_by: me.id, created_at: now() });
      });
      Object.assign(p, { status: 'received', received_at: now(), received_by: me.id });
      alert('Goods received: ' + p.purchase_no + ' · ' + sup.name, {}); save(); return wait(null);
    },
    async cancelPurchase(id) {
      if (!allow('purchases.manage')) fail('You are not allowed to change purchases');
      const p = D.purchases.find(x => x.id === id); if (!p || p.status !== 'ordered') fail('Only purchases that have not arrived can be cancelled');
      if (D.spays.some(x => x.purchase_id === id)) fail('This purchase has payments. Delete the payments first.');
      p.status = 'cancelled'; save(); return wait(null);
    },
    async listSupplierPayments() { if (!allow('purchases.manage')) return []; return wait(clone(D.spays).sort((a, b) => b.id - a.id)); },
    async paySupplier(pid, amount, method, note, date) {
      if (!allow('purchases.manage')) fail('You are not allowed to pay suppliers');
      const p = D.purchases.find(x => x.id === pid); if (!p || p.status === 'cancelled') fail('Purchase not found');
      if (!(+amount > 0)) fail('Enter the amount');
      if (+amount > p.total - p.paid_amount + 0.01) fail('That is more than you still owe ($' + (p.total - p.paid_amount).toFixed(2) + ')');
      D.spays.push({ id: ++D.seq.spay, purchase_id: pid, supplier_id: p.supplier_id, amount: +amount, method: method || 'bank', note: note || '', paid_on: date || localDay(now()), created_by: me.id, created_at: now() });
      p.paid_amount = +D.spays.filter(x => x.purchase_id === pid).reduce((s, x) => s + x.amount, 0).toFixed(2); save(); return wait(null);
    },
    async deleteSupplierPayment(id) {
      if (!allow('purchases.manage')) fail('You are not allowed to change supplier payments');
      const i = D.spays.findIndex(x => x.id === id); if (i < 0) fail('Payment not found'); const pid = D.spays[i].purchase_id; D.spays.splice(i, 1);
      const p = D.purchases.find(x => x.id === pid); p.paid_amount = +D.spays.filter(x => x.purchase_id === pid).reduce((s, x) => s + x.amount, 0).toFixed(2); save(); return wait(null);
    },

    async uploadPhoto(file) {
      // demo: keep a small copy of the photo inside the phone
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
      const s = Math.min(1, 480 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.6);
    }
  };
  save();
  return api;
};

    root.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
  }
  function sheet(title, html) {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sh"><span>${esc(title)}</span><button class="ib" data-close aria-label="Close">${icon('x')}</button></div><div class="sb">${html}</div></div>`;
    const close = () => o.remove();

    const { path, query } = parseHash();
    S.openConv = null;
    for (const [pattern, fn] of routes) {

// Settings loading, notifications (bell + phone), and the Khmer language option.
(function () {
  const K = window.KT;
  const { esc, icon } = K;

  // ---------------- settings (company info for invoices etc.) ----------------
  K.SETTINGS = {};
  K.loadSettings = async () => {
    try { K.SETTINGS = await K.api.getSettings(); } catch (e) { K.SETTINGS = {}; }
    const s = K.SETTINGS;
    K.COMPANY = Object.assign(K.COMPANY || {}, {
      name: s.company_name || 'K-TRONiCS', tagline: s.company_tagline || '', address: s.company_address || '', phone: s.company_phone || '',
      payNote: s.invoice_note || '', footer: s.invoice_footer || 'Thank you for your business!', logo: s.company_logo || ''
    });
  };
  K.loginHooks.push(K.loadSettings);

  // ---------------- notifications ----------------
  K.NOTIF = { unread: 0 };
  const bellHtml = () => `<button class="ib bell" data-bell aria-label="Notifications">${icon('bell')}${K.NOTIF.unread ? `<span class="badge">${K.NOTIF.unread > 99 ? '99+' : K.NOTIF.unread}</span>` : ''}</button>`;
  K.bellHtml = bellHtml;
  K.updateBell = () => document.querySelectorAll('[data-bell]').forEach(b => { b.outerHTML = bellHtml(); }) || bindBells();
  function bindBells() { document.querySelectorAll('[data-bell]').forEach(b => { b.onclick = openNotifs; }); }
  K.bindBells = bindBells;
  new MutationObserver(() => { document.querySelectorAll('[data-bell]:not([data-bound])').forEach(b => { b.setAttribute('data-bound', ''); b.onclick = openNotifs; }); })
    .observe(document.documentElement, { childList: true, subtree: true });
  async function refreshNotifs() {
    try { const list = await K.api.listNotifications(); K.NOTIF.unread = list.filter(n => !n.read_at).length; K.updateBell(); } catch (e) {}
  }
  K.refreshNotifs = refreshNotifs;
  async function openNotifs() {
    const s = K.sheet('Notifications', K.loading);
    const list = await K.api.listNotifications();
    K.$('.sb', s.el).innerHTML = (list.length ? `<div class="card flush">${list.map(n => `<button class="list-item" data-nl="${esc(n.link || '')}" style="${n.read_at ? '' : 'background:var(--ps)'}">
        <div class="ic-av sq">${icon('bell', 18)}</div><div class="grow"><div class="tt" style="font-size:14px">${esc(n.title)}</div>${n.body ? `<div class="st">${esc(n.body)}</div>` : ''}<div class="st">${K.when(n.created_at)} ${K.sameDay(n.created_at, new Date()) ? '' : K.hhmm(n.created_at)}</div></div></button>`).join('')}</div>`
      : `<div class="empty">${icon('bell', 30)}<div>No notifications yet</div></div>`) + pushBox();
    K.$$('[data-nl]', s.el).forEach(b => b.onclick = () => { s.close(); const l = b.dataset.nl; if (l) linkTo(l); });
    bindPush(s.el);
    if (list.some(n => !n.read_at)) { await K.api.markNotificationsRead(); K.NOTIF.unread = 0; K.updateBell(); }
  }
  K.openNotifs = openNotifs;
  // admin web uses different pages for some links
  function linkTo(l) {
    if (window.KT_CONFIG && window.KT_CONFIG.ADMIN) {
      const m = l.match(/^#\/orders\/(\d+)$/); if (m) return K.go('#/orders?o=' + m[1]);
      if (/^#\/customers\/\d+$/.test(l)) return K.go('#/customers');
      if (l.startsWith('#/chat')) { location.href = 'index.html' + l; return; }
      if (l === '#/leave') return K.go('#/hr?t=leave');
    }
    K.go(l);
  }
  K.api.onNotify = n => {
    if (n.kind === 'chat') return;           // chat already has its own toast and badge
    K.NOTIF.unread++; K.updateBell();
    K.toast(n.title + (n.body ? ' · ' + n.body : ''), () => linkTo(n.link || '#/home'));
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification(n.title, { body: n.body || '', icon: 'icons/icon-192.png', data: { link: n.link } }) : new Notification(n.title, { body: n.body || '' })) : new Notification(n.title, { body: n.body || '' }); } catch (e) {}
    }
  };
  K.loginHooks.push(refreshNotifs);

  // phone notifications (work even when the app is closed, once set up on the server)
  const pushState = () => !('Notification' in window) ? 'unsupported' : Notification.permission;
  function pushBox() {
    const st = pushState();
    if (st === 'granted') return `<div class="small muted" style="text-align:center">${icon('check', 14)} Phone notifications are on for this device</div>`;
    if (st === 'unsupported') return `<div class="small muted">This browser cannot show notifications. On iPhone, add the app to the Home Screen first.</div>`;
    return `<button class="btn out block" data-push>${icon('bell', 18)} Turn on phone notifications</button>`;
  }
  function bindPush(el) { K.$$('[data-push]', el).forEach(b => b.onclick = async () => { const ok = await K.enablePush(); if (ok) { b.outerHTML = pushBox(); } }); }
  K.pushBox = pushBox; K.bindPush = bindPush;
  K.enablePush = async () => {
    if (!('Notification' in window)) { K.toast('This phone cannot show notifications here'); return false; }
    const p = await Notification.requestPermission();
    if (p !== 'granted') { K.toast('Notifications are blocked. Allow them in the phone settings for this app.'); return false; }
    try {
      if (K.live && 'serviceWorker' in navigator && 'PushManager' in window) {
        const reg = await navigator.serviceWorker.ready;
        const key = await K.api.pushPublicKey();
        if (key) {
          const pad = '='.repeat((4 - key.length % 4) % 4), raw = atob((key + pad).replace(/-/g, '+').replace(/_/g, '/'));
          const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)) });
          await K.api.savePushSubscription(sub);
        }
      }
    } catch (e) { console.error(e); }
    K.toast('Notifications are on'); return true;
  };
  // re-save the subscription after login (endpoints can change)
  K.loginHooks.push(async () => { try { if (K.live && pushState() === 'granted' && 'serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); if (sub) await K.api.savePushSubscription(sub); } } catch (e) {} });

  // ---------------- Khmer language ----------------
  let LANG = 'en'; try { LANG = localStorage.getItem('kt_lang') || 'en'; } catch (e) {}
  K.lang = () => LANG;
  K.setLang = l => { LANG = l; try { localStorage.setItem('kt_lang', l); } catch (e) {} document.documentElement.lang = l === 'km' ? 'km' : 'en'; location.reload(); };
  K.langButtons = () => `<div class="seg" data-langseg>${[['en', 'English'], ['km', 'ភាសាខ្មែរ']].map(([k, l]) => `<button data-lang="${k}" class="${k === LANG ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-lang]'); if (b && b.dataset.lang !== LANG) K.setLang(b.dataset.lang); });
  const KM = window.KT_KM || {};
  const PAT = window.KT_KM_PATTERNS || [];
  const tr = t => {
    const k = t.trim(); if (!k) return null;
    if (KM[k]) return t.replace(k, KM[k]);
    for (const [re, out] of PAT) { const m = k.match(re); if (m) return t.replace(k, out.replace(/\$(\d)/g, (_, i) => KM[m[i]] || m[i])); }
    return null;
  };
  function translate(node) {
    if (LANG !== 'km') return;
    const walk = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentNode && /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const list = []; while (walk.nextNode()) list.push(walk.currentNode);
    list.forEach(n => { const v = tr(n.nodeValue); if (v != null && v !== n.nodeValue) n.nodeValue = v; });
    (node.querySelectorAll ? node.querySelectorAll('[placeholder]') : []).forEach(el => { const v = tr(el.getAttribute('placeholder')); if (v) el.setAttribute('placeholder', v); });
  }
  if (LANG === 'km') {
    document.documentElement.lang = 'km';
    const style = document.createElement('style');
    style.textContent = 'body,button,input,select,textarea{font-family:"Noto Sans Khmer","Plus Jakarta Sans",system-ui,sans-serif}';
    document.head.appendChild(style);
    const run = () => new MutationObserver(ms => ms.forEach(m => { m.addedNodes.forEach(n => { if (n.nodeType === 1) translate(n); else if (n.nodeType === 3) { const v = tr(n.nodeValue); if (v != null && v !== n.nodeValue) n.nodeValue = v; } });
      if (m.type === 'characterData') { const v = tr(m.target.nodeValue); if (v != null && v !== m.target.nodeValue) m.target.nodeValue = v; } }))
      .observe(document.body, { childList: true, subtree: true, characterData: true });
    if (document.body) { translate(document.body); run(); } else window.addEventListener('DOMContentLoaded', () => { translate(document.body); run(); });
    const toast0 = K.toast; K.toast = (m, cb) => toast0(tr(String(m)) || m, cb);
  }
})();

      const amount = +K.$('#am', s.el).value;

      const row = { id: e.id, spent_on: K.$('#dt', s.el).value || today(), category: cat, amount, currency: cur, note: K.$('#nt', s.el).value.trim(), photo, receipt_url: e.receipt_url };
      if (boss) { row.staff_id = forStaff; if (!e.id) row.status = newStatus; }
      await K.busy(ev.currentTarget, () => K.api.saveExpense(row));
      s.close(); K.toast(boss && forStaff !== me.id ? 'Saved for ' + who(forStaff) : 'Expense saved'); onSaved && onSaved();
    };
    if (K.$('#del', s.el)) K.$('#del', s.el).onclick = async ev => { const _btn = ev.currentTarget;
      if (!(await K.confirmSheet('Delete this expense?', 'It will be removed.', 'Delete', true))) return;
      await K.busy(_btn, () => K.api.deleteExpense(e.id)); s.close(); K.toast('Deleted'); onSaved && onSaved();
    };
  };

  // Sum a list of expenses (rejected ones are not counted)
  K.expTotals = list => {
    const t = { total: 0, pending: 0, approved: 0, paid: 0, byCat: {}, count: 0 };
    list.forEach(e => { if (e.status === 'rejected') return; const v = +e.amount_usd; t.total += v; t[e.status] += v; t.byCat[e.category] = (t.byCat[e.category] || 0) + v; t.count++; });
    return t;
  };
  K.expCatBars = byCat => {
    const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]); const max = Math.max(1, ...rows.map(r => r[1]));
    return rows.length ? rows.map(([k, v]) => `<div class="row" style="gap:10px">${K.expIcon(k, 32)}<div class="grow"><div class="row small" style="gap:6px"><b class="grow">${K.EXP_CATS[k][0]}</b><b>${money(v)}</b></div>
      <div class="bar" style="margin-top:5px"><div style="width:${(v / max) * 100}%;background:${K.EXP_CATS[k][2]}"></div></div></div></div>`).join('') : '<div class="muted small">No expenses in this period</div>';
  };
  K.expPeriod = (key) => { const n = new Date(), s = new Date(n.getFullYear(), n.getMonth(), 1);
    if (key === 'month') return [s, null]; if (key === 'last') return [new Date(n.getFullYear(), n.getMonth() - 1, 1), s];
    if (key === 'week') return [new Date(Date.now() - 7 * 86400000), null]; if (key === 'today') { const t = new Date(); t.setHours(0, 0, 0, 0); return [t, null]; } return [null, null]; };
  K.inPeriod = (e, [a, b]) => { const d = new Date(e.spent_on + 'T12:00:00'); return (!a || d >= a) && (!b || d < b); };
})();

// One date filter used everywhere (staff app orders, admin orders, admin reports)
(function () {
  const K = window.KT;
  const dstr = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
  const today = () => dstr(new Date());
  const ago = n => dstr(new Date(Date.now() - n * 86400000));
  const P = {
    LIST: [['today', 'Today'], ['week', 'Last 7 days'], ['month', 'This month'], ['last', 'Last month'], ['custom', 'Custom']],
    QUICK: [['y', 'Yesterday'], ['d30', 'Last 30 days'], ['d90', 'Last 90 days'], ['yr', 'This year']],
    dstr, today,
    // [from, to] as YYYY-MM-DD, both days included
    range(p, from, to) {
      const t = today(), n = new Date();
      if (p === 'today') return [t, t];
      if (p === 'week') return [ago(6), t];
      if (p === 'month') return [t.slice(0, 8) + '01', t];
      if (p === 'last') return [dstr(new Date(n.getFullYear(), n.getMonth() - 1, 1)), dstr(new Date(n.getFullYear(), n.getMonth(), 0))];
      return [from || ago(29), to || t];
    },
    quick(k) { const t = today(); return k === 'y' ? [ago(1), ago(1)] : k === 'd30' ? [ago(29), t] : k === 'd90' ? [ago(89), t] : [t.slice(0, 4) + '-01-01', t]; },
    day: (dayStr, st) => { const [a, b] = P.range(st.p, st.from, st.to); return dayStr >= a && dayStr <= b; },
    fresh: p => { const st = { p: p || 'month', from: '', to: today() }; st.from = P.range('custom')[0]; return st; },
    has: (o, p, from, to) => { const [a, b] = P.range(p, from, to), d = dstr(o.created_at); return d >= a && d <= b; },
    // chips + (for Custom) From/To boxes and quick buttons
    html(p, from, to) {
      const t = today();
      return `<div class="pchips">${P.LIST.map(([k, l]) => `<button class="chip ${k === p ? 'on' : ''}" data-per="${k}">${k === 'custom' ? K.icon('clock', 15) + ' ' : ''}${l}</button>`).join('')}</div>
        ${p === 'custom' ? `<div class="card pcustom"><div class="btns"><label class="f">From<input class="inp" type="date" data-pf value="${from}" max="${t}"></label><label class="f">To<input class="inp" type="date" data-pt value="${to}" max="${t}"></label></div>
          <div class="row" style="gap:6px;flex-wrap:wrap">${P.QUICK.map(([k, l]) => `<button class="chip" data-pq="${k}" style="height:32px">${l}</button>`).join('')}</div></div>` : ''}`;
    },
    // onChange(period, from, to)
    bind(root, st, onChange) {
      K.$$('[data-per]', root).forEach(b => b.onclick = () => { const p = b.dataset.per; if (p === 'custom' && st.p !== 'custom') { [st.from, st.to] = P.range(st.p, st.from, st.to); } st.p = p; onChange(st); });
      const f = K.$('[data-pf]', root), t = K.$('[data-pt]', root);
      if (f) f.onchange = () => { st.from = f.value || st.from; if (st.from > st.to) st.to = st.from; onChange(st); };
      if (t) t.onchange = () => { st.to = t.value || st.to; if (st.from > st.to) st.from = st.to; onChange(st); };
      K.$$('[data-pq]', root).forEach(b => b.onclick = () => { [st.from, st.to] = P.quick(b.dataset.pq); onChange(st); });
    },
    label(st) { const [a, b] = P.range(st.p, st.from, st.to); const f = d => new Date(d + 'T00:00:00').toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }); return a === b ? f(a) : f(a) + ' – ' + f(b); }
  };
  K.period = P;
})();

  // Load goods onto a sales rep's motorbike (or bring them back) — many products at once

// Invoices: drawn as a picture (PNG), saved as PDF, or shared (Telegram etc.).
// The layout lives in drawInvoice() so a new design only changes this one function.
(function () {
  const K = window.KT;
  const { esc, money, icon } = K;

  // Company details printed on every invoice (will come from the design / settings later)
  K.COMPANY = Object.assign({ name: 'K-TRONiCS', tagline: 'Phone accessories wholesale', phone: '', address: 'Phnom Penh, Cambodia', payNote: '' }, (window.KT_CONFIG || {}).COMPANY || {});

  const W = 1240;                      // A4 width at 150 dpi
  const FONT = '"Plus Jakarta Sans", "Noto Sans Khmer", sans-serif';
  const C = { ink: '#1B1830', mu: '#6B6780', line: '#E6E3EF', p: '#5B3FD9', ps: '#EFEBFE', gr: '#1E7A45', rd: '#B3261E', bg: '#F7F6FB' };
  const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const invNo = o => 'INV-' + String(o.order_no || o.id).replace(/^SO-/, '');
  const approvedAt = o => ((o.events || []).find(e => e.status === 'approved') || {}).created_at || o.created_at;

  function fit(ctx, text, max) {
    text = String(text ?? '');
    if (ctx.measureText(text).width <= max) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
    return text + '…';
  }

  const LOGO = { src: '', img: null };
  function loadLogo() {
    const src = K.COMPANY.logo || '';
    if (!src) { LOGO.src = ''; LOGO.img = null; return Promise.resolve(); }
    if (LOGO.src === src && LOGO.img) return Promise.resolve();
    return new Promise(res => { const im = new Image(); if (!src.startsWith('data:')) im.crossOrigin = 'anonymous';
      im.onload = () => { LOGO.src = src; LOGO.img = im; res(); }; im.onerror = () => { LOGO.src = ''; LOGO.img = null; res(); };
      setTimeout(res, 5000); im.src = src; });
  }

  function drawInvoice(o, scale) {
    const items = o.items || [], pays = (o.payments || []).filter(p => p.status === 'confirmed');
    const rowH = 64, top = 560, H = Math.max(1754, top + 90 + items.length * rowH + 520);
    const cv = document.createElement('canvas'); cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext('2d'); ctx.scale(scale, scale);
    const t = (s, x, y, size, weight = 400, color = C.ink, align = 'left', max) => {
      ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
      ctx.fillText(max ? fit(ctx, s, max) : String(s ?? ''), x, y);
    };
    const line = (y, x1 = 90, x2 = W - 90, col = C.line, w = 2) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke(); };
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    // top band
    ctx.fillStyle = C.p; ctx.fillRect(0, 0, W, 16);
    // logo + company
    if (LOGO.img && LOGO.src === K.COMPANY.logo) {
      const im = LOGO.img, k = Math.min(96 / im.naturalWidth, 96 / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k;
      ctx.drawImage(im, 90 + (96 - w) / 2, 80 + (96 - h) / 2, w, h);
    } else {
      ctx.fillStyle = C.p; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(90, 80, 96, 96, 22) : ctx.rect(90, 80, 96, 96); ctx.fill();
      t((K.COMPANY.name || 'K').trim().charAt(0).toUpperCase(), 138, 150, 58, 800, '#fff', 'center');
    }
    t(K.COMPANY.name, 210, 122, 44, 800);
    t(K.COMPANY.tagline, 210, 160, 24, 400, C.mu);
    const info = [K.COMPANY.address, K.COMPANY.phone].filter(Boolean).join(' · ');
    if (info) t(info, 210, 194, 22, 400, C.mu, 'left', 520);
    t('INVOICE', W - 90, 130, 56, 800, C.p, 'right');
    t(invNo(o), W - 90, 172, 26, 700, C.ink, 'right');
    // meta
    line(250);
    const c = o.customers || {};
    t('BILL TO', 90, 305, 20, 700, C.mu);
    t(c.name || '', 90, 350, 32, 700, C.ink, 'left', 560);
    const cl = [c.owner_name, c.phone].filter(Boolean).join(' · '); if (cl) t(cl, 90, 392, 23, 400, C.mu, 'left', 560);
    const ad = c.address || c.area || ''; if (ad) t(ad, 90, 428, 23, 400, C.mu, 'left', 560);
    const meta = [['Invoice date', fmtDate(approvedAt(o))], ['Order', o.order_no], ['Province', c.province || '-'], ['Payment', { cash: 'Cash', credit: 'Credit' + (c.credit_days ? ' · ' + c.credit_days + ' days' : ''), bank: 'ABA / Bank' }[o.payment_method] || o.payment_method || ''], ['Sales rep', K.repName(o)]];
    meta.forEach(([k, v], i) => { t(k, 760, 305 + i * 42, 22, 400, C.mu); t(v, W - 90, 305 + i * 42, 23, 700, C.ink, 'right', 260); });
    // table head
    ctx.fillStyle = C.bg; ctx.fillRect(90, top - 50, W - 180, 64);
    const X = { n: 115, name: 175, qty: 780, price: 960, amt: W - 115 };
    t('#', X.n, top - 8, 20, 700, C.mu); t('PRODUCT', X.name, top - 8, 20, 700, C.mu); t('QTY', X.qty, top - 8, 20, 700, C.mu, 'right'); t('PRICE', X.price, top - 8, 20, 700, C.mu, 'right'); t('AMOUNT', X.amt, top - 8, 20, 700, C.mu, 'right');
    items.forEach((it, i) => {
      const y = top + 50 + i * rowH, p = it.products || {};
      t(i + 1, X.n, y, 23, 400, C.mu);
      t(p.name || '', X.name, y - (p.sku ? 8 : 0), 25, 600, C.ink, 'left', 540);
      if (p.sku) t(p.sku, X.name, y + 20, 18, 400, C.mu);
      t(it.qty, X.qty, y, 25, 600, C.ink, 'right'); t(money(it.price), X.price, y, 24, 400, C.ink, 'right'); t(money(it.qty * it.price), X.amt, y, 25, 700, C.ink, 'right');
      line(y + 30);
    });
    // totals
    let y = top + 50 + items.length * rowH + 40;
    const paid = +o.paid_amount || 0, bal = Math.max(0, +o.total - paid);
    const tot = [['Subtotal', money(o.total)], ['Paid', money(paid)]];
    tot.forEach(([k, v], i) => { t(k, 760, y + i * 46, 24, 400, C.mu); t(v, W - 90, y + i * 46, 25, 600, C.ink, 'right'); });
    y += tot.length * 46 + 10;
    ctx.fillStyle = bal > 0 ? '#FDECEA' : '#E3F4EA'; ctx.fillRect(740, y - 6, W - 830, 76);
    t(bal > 0 ? 'Balance due' : 'Total', 760, y + 44, 26, 700, bal > 0 ? C.rd : C.gr);
    t(money(bal > 0 ? bal : o.total), W - 110, y + 46, 36, 800, bal > 0 ? C.rd : C.gr, 'right');
    // paid stamp

      ctx.save(); ctx.translate(330, y + 10); ctx.rotate(-0.18); ctx.strokeStyle = C.gr; ctx.lineWidth = 6; ctx.strokeRect(-130, -58, 260, 100);

    }

    }

    t(K.COMPANY.footer || 'Thank you for your business!', 90, fy + (K.COMPANY.payNote ? 40 : 0), 24, 700, C.p);
    t('Printed ' + fmtDate(new Date()) + ' · ' + K.COMPANY.name, W - 90, H - 60, 18, 400, C.mu, 'right');
    return cv;
  }

  // ---------- very small PDF writer (one page, one JPEG) ----------
  function pdfFromCanvas(cv) {
    const jpg = atob(cv.toDataURL('image/jpeg', 0.92).split(',')[1]);
    const pw = 595.28, ph = +(pw * cv.height / cv.width).toFixed(2);
    const parts = [], offs = []; let len = 0;
    const add = s => { parts.push(s); len += s.length; };
    const obj = (n, body) => { offs[n] = len; add(`${n} 0 obj\n${body}\nendobj\n`); };
    add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
    obj(4, `<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n${jpg}\nendstream`);
    const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    const xref = len;
    add(`xref\n0 6\n0000000000 65535 f \n${[1, 2, 3, 4, 5].map(n => String(offs[n]).padStart(10, '0') + ' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    const s = parts.join(''), bytes = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i) & 255;
    return new Blob([bytes], { type: 'application/pdf' });
  }

  const toBlob = cv => new Promise(r => cv.toBlob(r, 'image/png'));

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);

      <div class="small muted">${canShare ? 'Share opens your phone\'s share menu. Choose Telegram and pick the shop\'s chat.' : 'Save the image or PDF, then send it to the shop in Telegram.'}</div>`;
    const note = () => { if (!K.live) K.toast('In the demo the file may not download. In the real app it saves to your phone or computer.'); };

    const mains = whs.filter(w => !w.rep_id);

    const supOf = () => sups.find(x => x.id === +d.sup) || {};

    const cur = () => { K.$('#pc', s.el).value = d.cur; K.$('#pr', s.el).value = d.rate; K.$('#prl', s.el).style.display = d.cur === 'USD' ? 'none' : ''; };
    const goodsUsd = () => Object.entries(d.lines).reduce((a, [pid, q]) => a + q * (+d.cost[pid] || 0) / (d.cur === 'USD' ? 1 : d.rate || 1), 0);
    const drawT = () => { const g = goodsUsd(), n = Object.values(d.lines).reduce((a, b) => a + b, 0);
      K.$('#pt', s.el).innerHTML = `<div class="row small"><span class="grow muted">${Object.keys(d.lines).length} products · ${n} pcs</span><b>Goods ${money(g)}</b></div>

    const drawL = () => { const t = K.$('#pq', s.el).value.toLowerCase();
      const list = products.filter(p => d.lines[p.id] || !t || p.name.toLowerCase().includes(t) || p.sku.toLowerCase().includes(t)).sort((a, b) => (!!d.lines[b.id]) - (!!d.lines[a.id]));
      K.$('#pl', s.el).innerHTML = list.map(p => `<div class="list-item" style="gap:8px"><div class="grow" style="min-width:0"><div class="tt" style="font-size:14px">${esc(p.name)}</div><div class="st">${esc(p.sku)} · in stock ${p.total_qty} · cost now ${money(p.cost)}</div></div>

      K.$$('[data-q]', s.el).forEach(i => i.oninput = () => { const v = Math.max(0, Math.floor(+i.value || 0)), pid = i.dataset.q;
