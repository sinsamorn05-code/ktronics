      K.$$('[data-c]', s.el).forEach(i => i.oninput = () => { d.cost[i.dataset.c] = +i.value || 0; drawT(); }); };
    K.$('#ps', s.el).onchange = e => {
      if (e.target.value === 'new') { e.target.value = d.sup || ''; return K.supplierSheet({}, x => { s.close(); K.newPurchaseSheet(onDone, x.id); }); }
      d.sup = +e.target.value; const c = supOf().currency || 'USD'; if (c !== d.cur) { d.cur = c; d.rate = c === 'USD' ? 1 : K.RATE_HINT[c] || 1; d.cost = {}; cur(); drawL(); } drawT(); };
    K.$('#pw', s.el).onchange = e => { d.wh = +e.target.value; };
    K.$('#pc', s.el).onchange = e => { d.cur = e.target.value; d.rate = d.cur === 'USD' ? 1 : K.RATE_HINT[d.cur] || 1; d.cost = {}; cur(); drawL(); drawT(); };
    K.$('#pr', s.el).oninput = e => { d.rate = +e.target.value || 1; drawT(); };
    K.$('#px', s.el).oninput = e => { d.extra = Math.max(0, +e.target.value || 0); drawT(); };
    K.$('#pq', s.el).oninput = drawL;
    const save = receive => async e => {
      if (!d.sup) return K.toast('Add a supplier first');
      const items = Object.entries(d.lines).map(([pid, qty]) => ({ product_id: +pid, qty, unit_cost: +d.cost[pid] || 0 }));

    };

    if (K.$('#pgo', s.el)) K.$('#pgo', s.el).onclick = save(true);
    if (!act.length) { K.toast('Add your first supplier'); K.supplierSheet({}, x => { s.close(); K.newPurchaseSheet(onDone, x.id); }); }
    cur(); drawL(); drawT();
  };
})();

    function shopDebtSheet(cid) {

      const s = sheet(c.name || 'Shop', `<div class="small muted">${esc(c.province || '')} · ${esc(c.rep_name || 'no sales rep')}${c.phone ? ' · ' + esc(c.phone) : ''}</div>

    const costOf = i => i.cost != null ? +i.cost : +((prods.find(p => p.id === i.product_id) || {}).cost || 0);

    const draw = () => {
      $('#cust').innerHTML = P.html(st.p, st.from, st.to) + `<div class="small muted">${esc(P.label(st))}</div>`;

      const sold = orders.filter(o => !['pending', 'cancelled'].includes(o.status) && (!a || new Date(o.created_at) >= a) && (!b || new Date(o.created_at) < b));
      const ids = new Set(sold.map(o => o.id));
      const total = sold.reduce((s, o) => s + +o.total, 0), paid = sold.reduce((s, o) => s + (o.status === 'paid' ? +o.total : +(o.paid_amount || 0)), 0);
      const group = (key, name) => { const m = {}; sold.forEach(o => { const k = key(o); m[k] = m[k] || { name: name(o), n: 0, total: 0 }; m[k].n++; m[k].total += +o.total; }); return Object.values(m).sort((x, y) => y.total - x.total); };
      const byStaff = group(o => o.sales_rep_id || o.created_by, o => K.repName(o)), byShop = group(o => o.customer_id, o => o.customers.name);
      const prod = {}; items.filter(i => ids.has(i.order_id)).forEach(i => { prod[i.product_id] = prod[i.product_id] || { name: i.products.name, qty: 0, total: 0, cost: 0 }; prod[i.product_id].qty += i.qty; prod[i.product_id].total += i.qty * i.price; prod[i.product_id].cost += i.qty * costOf(i); });
      const cogs = Object.values(prod).reduce((s, x) => s + x.cost, 0), gross = total - cogs;
      const expT = exps.filter(e => ['approved', 'paid'].includes(e.status) && P.day(e.spent_on, st)).reduce((s, e) => s + +e.amount_usd, 0), net = gross - expT;

        ${showProfit ? `<div class="card"><b>Profit</b><div class="small muted">Sales minus the cost price of the goods sold (includes shipping and tax from purchases), then minus approved staff expenses.</div>
          <div class="kpis">${kpi(money(total), 'Sales')}${kpi(money(cogs), 'Cost of goods sold')}${kpi(money(gross), 'Gross profit · ' + (total ? Math.round(gross / total * 100) : 0) + '%', gross >= 0 ? 'var(--gr)' : 'var(--rd)')}${kpi(money(expT), 'Staff expenses')}${kpi(money(net), 'Net profit', net >= 0 ? 'var(--gr)' : 'var(--rd)')}</div></div>
        ${table('Profit by product', ['Product', 'Pcs', 'Sales', 'Cost', 'Profit', 'Margin'], Object.values(prod).map(r => Object.assign({ pr: r.total - r.cost }, r)).sort((x, y) => y.pr - x.pr).slice(0, 20).map(r => [esc(r.name), r.qty, money(r.total), money(r.cost), `<b style="color:${r.pr >= 0 ? 'var(--gr)' : 'var(--rd)'}">${money(r.pr)}</b>`, (r.total ? Math.round(r.pr / r.total * 100) : 0) + '%']))}` : ''}`;
    };

      toast(K.live ? 'Downloading expenses list' : 'In the real app this downloads an Excel-ready file');
    };
    draw();
  });

  // ---------------- Roles & permissions (admin only) ----------------
  const PROLES = [['manager', 'Manager'], ['sales', 'Sales'], ['warehouse', 'Warehouse'], ['driver', 'Driver']];
  route(/^\/permissions$/, async (_, q, current) => {
    if (S.me.role !== 'admin') return go('#/dashboard');
    await refreshCounts();
    const main = shell('permissions', 'Roles & permissions', '', 'Admin always has full access');
    let [pm, staff] = await Promise.all([api.listPermissions(), data.staff(true)]);
    if (!current()) return;
    let tab = q.u ? 'person' : 'role', who = q.u || '';
    const roleHas = (r, perm) => { const x = pm.roles.find(y => y.role === r && y.perm === perm); return !!(x && x.allowed); };
    const userOv = (u, perm) => { const x = pm.users.find(y => y.user_id === u && y.perm === perm); return x ? x.allowed : null; };
    const people = staff.filter(u => u.active && u.role !== 'admin');
    const reload = async () => { pm = await api.listPermissions(); };
    const draw = () => {
      $('#tabs').innerHTML = [['role', 'By role'], ['person', 'Exceptions for one person']].map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
      $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
      if (tab === 'role') {
        $('#pbody').innerHTML = `<div class="card flush"><div class="pgrid phead"><span>Permission</span>${PROLES.map(([, l]) => `<span>${l}</span>`).join('')}</div>
          ${window.KT_PERMS.map(g => `<div class="pgroup">${esc(g.group)}</div>` + g.items.map(([k, label, help]) => `<div class="pgrid"><div><div class="plabel">${esc(label)}</div>${help ? `<div class="small muted">${esc(help)}</div>` : ''}</div>
            ${PROLES.map(([r, rl]) => `<label class="pcell"><span class="hidden">${esc(label)} for ${rl}</span><input type="checkbox" data-r="${r}" data-k="${k}" ${roleHas(r, k) ? 'checked' : ''}></label>`).join('')}</div>`).join('')).join('')}</div>
          <button class="btn out" id="reset">${icon('refresh', 18)}Reset all roles to the starting setup</button>`;
        $$('[data-r]').forEach(c => c.onchange = async () => {
          c.disabled = true;
          try { await api.setRolePermission(c.dataset.r, c.dataset.k, c.checked); await reload(); toast('Saved'); } catch (e) { c.checked = !c.checked; toast(e.message); }
          c.disabled = false;
        });
        $('#reset').onclick = async ev => { const _btn = ev.currentTarget;
          if (!(await K.confirmSheet('Reset permissions?', 'Every role goes back to the starting setup. Exceptions for single people stay.', 'Reset', true))) return;
          await busy(_btn, async () => { for (const [r] of PROLES) for (const k of window.KT_PERM_KEYS) { const want = window.KT_PERM_DEFAULTS[r].includes(k); if (roleHas(r, k) !== want) await api.setRolePermission(r, k, want); } await reload(); });
          toast('Back to the starting setup'); draw();
        };
      } else {
        const u = people.find(x => x.id === who);
        $('#pbody').innerHTML = `<label class="f">Staff member<select class="inp" id="who"><option value="">Choose a person…</option>${people.map(x => `<option value="${esc(x.id)}" ${x.id === who ? 'selected' : ''}>${esc(x.full_name)} (${esc(ROLE_LABEL[x.role])})</option>`).join('')}</select></label>
          ${u ? `<div class="small muted">"Role" follows the ${esc(ROLE_LABEL[u.role])} setting. Choose Allow or Block to make an exception only for ${esc(u.full_name)}.</div>
          <div class="card flush">${window.KT_PERMS.map(g => `<div class="pgroup">${esc(g.group)}</div>` + g.items.map(([k, label]) => { const ov = userOv(u.id, k), def = roleHas(u.role, k);
            return `<div class="list-item" style="flex-wrap:wrap"><div class="grow" style="min-width:180px"><div class="plabel">${esc(label)}</div><div class="small ${ov === null ? 'muted' : ''}" style="${ov === null ? '' : 'color:var(--p);font-weight:700'}">${ov === null ? 'Role: ' + (def ? 'allowed' : 'not allowed') : 'Exception: ' + (ov ? 'allowed' : 'blocked')}</div></div>
              <div class="seg" style="width:230px">${[['', 'Role'], ['1', 'Allow'], ['0', 'Block']].map(([v, l]) => `<button data-k="${k}" data-v="${v}" class="${(v === '' && ov === null) || (v === '1' && ov === true) || (v === '0' && ov === false) ? 'on' : ''}">${l}</button>`).join('')}</div></div>`; }).join('')).join('')}</div>` : '<div class="empty">Choose a person to see and change their permissions</div>'}`;
        $('#who').onchange = e => { who = e.target.value; draw(); };
        $$('[data-v]').forEach(b => b.onclick = async () => {
          const v = b.dataset.v === '' ? null : b.dataset.v === '1';
          try { await api.setUserPermission(who, b.dataset.k, v); await reload(); toast('Saved'); draw(); } catch (e) { toast(e.message); }
        });
      }
    };
    main.innerHTML = `<div class="apad"><div class="card small muted"><div style="line-height:1.5">Tick what each role may do. Changes save straight away and apply the next time staff open the app. The <b>Admin</b> always has every permission, so you can never lock yourself out. Only the admin can change staff roles and this page.</div></div>
      <div class="seg" id="tabs"></div><div id="pbody" style="display:flex;flex-direction:column;gap:14px"></div></div>`;
    draw();
  });
})();

          <div class="card flush">${list.map(p => `<button class="list-item" data-po="${p.id}"><div class="ic-av sq">${icon('truck', 20)}</div><div class="grow"><div class="tt">${esc(p.purchase_no)} · ${esc(p.suppliers.name)}</div>
            <div class="st">${K.poDate(p.ordered_on)} · ${esc(p.warehouses.name)}${p.currency !== 'USD' ? ' · ' + esc(p.currency) : ''}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><b>${money(p.total)}</b><div class="row" style="gap:4px">${K.poPill(p.status)}${mgr ? K.poOwedPill(p) : ''}</div></div></button>`).join('') || emptyBox('truck', 'No purchases for these dates')}</div>`;
      } else if (tab === 'suppliers') {
        h = `<div class="kpis">${A.kpi(sups.filter(s => s.active !== false).length, 'Suppliers')}${A.kpi(money(owedAll), 'We still owe suppliers', owedAll ? 'var(--rd)' : null)}</div>
          <div class="card flush">${sups.map(s => { const mine = pos.filter(p => p.supplier_id === s.id && p.status !== 'cancelled'), ow = mine.reduce((a, p) => a + K.poOwed(p), 0), last = mine.map(p => p.ordered_on).sort().pop();
            return `<button class="list-item" data-sup="${s.id}"><div class="ic-av sq">${icon('store', 20)}</div><div class="grow"><div class="tt">${esc(s.name)}${s.active === false ? ' <span class="pill gy">Hidden</span>' : ''}</div>
              <div class="st">${esc([s.country, s.currency, s.contact_name, s.phone].filter(Boolean).join(' · '))}</div><div class="st">${mine.length} purchases · ${money(mine.reduce((a, p) => a + +p.total, 0))} bought${last ? ' · last ' + K.poDate(last) : ''}</div></div>
              ${ow > 0 ? `<span class="pill rd">owe ${money(ow)}</span>` : '<span class="pill gr">Paid up</span>'}</button>`; }).join('') || emptyBox('store', 'No suppliers yet. Tap + Supplier.')}</div>`;
      } else if (tab === 'prices') {

        if (!prodF && bought[0]) prodF = String(bought[0].id);
        const rows = items.filter(i => String(i.product_id) === prodF).map(i => Object.assign({ p: pos.find(p => p.id === i.purchase_id) }, i)).filter(r => r.p && r.p.status !== 'cancelled').sort((a, b) => b.p.ordered_on.localeCompare(a.p.ordered_on));
        const pr = prods.find(p => String(p.id) === prodF);
        h = `<div class="filters"><select class="inp" id="pf" style="width:auto;min-width:260px" aria-label="Product">${bought.map(b => `<option value="${b.id}" ${String(b.id) === prodF ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>
            ${pr ? `<span class="small">Average cost now <b>${money(pr.cost)}</b> · sell price <b>${money(pr.price)}</b> · margin <b style="color:var(--gr)">${pr.price ? Math.round((pr.price - pr.cost) / pr.price * 100) : 0}%</b></span>` : ''}</div>
          <div class="card"><b>What you paid for it</b><div class="tbl"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Supplier</th><th style="text-align:right">Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Landed cost</th></tr></thead><tbody>
            ${rows.map(r => `<tr><td>${K.poDate(r.p.ordered_on)}</td><td>${esc(r.p.suppliers.name)} <span class="muted small">${esc(r.p.purchase_no)}</span></td><td style="text-align:right">${r.qty}</td><td style="text-align:right">${K.curMoney(r.unit_cost, r.p.currency)}</td><td style="text-align:right"><b>${money(r.landed_cost)}</b></td></tr>`).join('') || '<tr><td colspan="5" class="muted">No purchases of this product yet</td></tr>'}</tbody></table></div>
            <div class="small muted">Landed cost = price in dollars + its share of shipping, tax and other costs.</div></div>`;
      } else {
        const now = new Date(), months = []; for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
        const ok = pos.filter(p => p.status !== 'cancelled');

        <div class="card flush">${mine.map(p => `<button class="list-item" data-spo="${p.id}"><div class="grow"><div class="tt" style="font-size:14px">${esc(p.purchase_no)} · ${K.poDate(p.ordered_on)}</div><div class="st">${money(p.total)}</div></div><div class="row" style="gap:4px">${K.poPill(p.status)}${K.poOwedPill(p)}</div></button>`).join('') || '<div class="empty">No purchases yet</div>'}</div>

    main.innerHTML = `<div class="chips" id="tabs"></div><div class="apad" id="pbody"></div>`;
    draw();
    if (q.o) K.purchaseSheet(+q.o, reload);
  });
})();

// Staff app: attendance (start / finish work with GPS + selfie) and leave requests.
(function () {
  const K = window.KT;
  const { api, S, esc, $, $$, icon, page, route, go, emptyBox, busy, toast } = K;
  const hm = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  K.isLate = a => { const [h, m] = String((K.SETTINGS || {}).work_start || '08:00').split(':').map(Number); const t = new Date(a.check_in_at); return t.getHours() * 60 + t.getMinutes() > h * 60 + m + 5; };
  K.hoursOf = a => a.check_out_at ? (new Date(a.check_out_at) - new Date(a.check_in_at)) / 3600000 : 0;
  const pos = () => new Promise(res => { if (!navigator.geolocation) return res(null); setTimeout(() => res(null), 12000);
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }); });

  // card for the home screen
  K.attendanceCard = async () => {
    const a = await api.todayAttendance();
    if (!a) return `<a class="card" href="#/attendance" style="text-decoration:none;color:inherit;border-color:#C5D8F5;background:var(--bls)"><div class="row"><div class="ic-av sq" style="background:#fff;color:var(--bl)">${icon('clock')}</div><div class="grow"><div class="tt">Start work</div><div class="st">Tap to clock in with GPS and a selfie</div></div>${icon('right', 20)}</div></a>`;
    if (!a.check_out_at) return `<a class="card" href="#/attendance" style="text-decoration:none;color:inherit"><div class="row"><div class="ic-av sq" style="background:var(--grs);color:var(--gr)">${icon('check')}</div><div class="grow"><div class="tt">Working since ${hm(a.check_in_at)}${K.isLate(a) ? ' <span class="pill or">Late</span>' : ''}</div><div class="st">Tap here to finish work</div></div>${icon('right', 20)}</div></a>`;
    return '';
  };

  route(/^\/attendance$/, async (_, __, current) => {
    const main = page({ title: 'My attendance', sub: 'Work starts ' + ((K.SETTINGS || {}).work_start || '08:00'), back: '#/home' });
    const P = K.period, st = P.fresh('month');
    const [today, list] = await Promise.all([api.todayAttendance(), api.listAttendance(P.range('last')[0], P.today())]);
    if (!current()) return;
    let photo = null;
    const draw = () => {
      const [a, b] = P.range(st.p, st.from, st.to);
      const mine = list.filter(x => x.staff_id === S.me.id && x.work_date >= a && x.work_date <= b);
      const late = mine.filter(K.isLate).length, hours = mine.reduce((s, x) => s + K.hoursOf(x), 0);
      $('#hist').innerHTML = `${P.html(st.p, st.from, st.to)}
        <div class="stats three"><div class="stat"><b>${mine.length}</b><span>Days worked</span></div><div class="stat"><b style="color:${late ? 'var(--or)' : 'inherit'}">${late}</b><span>Late days</span></div><div class="stat"><b>${Math.round(hours)}</b><span>Hours</span></div></div>
        <div class="card flush">${mine.map(x => `<div class="list-item">${x.photo_url ? `<img src="${esc(x.photo_url)}" alt="Selfie" style="width:40px;height:40px;border-radius:50%;object-fit:cover">` : `<div class="ic-av sq">${icon('clock', 18)}</div>`}
          <div class="grow"><div class="tt" style="font-size:14px">${esc(K.dayLabel(x.work_date + 'T12:00:00'))}</div><div class="st">${hm(x.check_in_at)} – ${x.check_out_at ? hm(x.check_out_at) : 'working'}${x.check_out_at ? ' · ' + K.hoursOf(x).toFixed(1) + ' h' : ''}</div></div>
          ${K.isLate(x) ? '<span class="pill or">Late</span>' : '<span class="pill gr">On time</span>'}</div>`).join('') || emptyBox('clock', 'No attendance for these dates')}</div>`;
      P.bind($('#hist'), st, draw);

    const card = (href, ic, title, sub, bg, bd, fg) => `<a class="card" href="${href}" style="text-decoration:none;color:inherit;border-color:${bd};background:${bg};margin-top:${html ? 12 : 0}px"><div class="row"><div class="ic-av sq" style="background:#fff;color:${fg}">${icon(ic)}</div><div class="grow"><div class="tt">${title}</div><div class="st">${sub}</div></div>${icon('right', 20)}</div></a>`;
    const poWait = pos.filter(p => p.status === 'ordered').length;
    if (poWait) html += card('#/purchases', 'truck', poWait + ' deliver' + (poWait > 1 ? 'ies' : 'y') + ' from suppliers', 'Tap "Goods arrived" when they come', 'var(--bls)', '#C5D8F5', 'var(--bl)');
    if (toCheck) html += card('#/payments?t=check', 'cash', toCheck + ' payment' + (toCheck > 1 ? 's' : '') + ' to check', 'Money collected by staff', 'var(--grs)', '#BFE3CC', 'var(--gr)');
    if (K.allow('payments.collect') && !K.allow('payments.confirm')) {
      const un = orders.filter(o => o.status === 'delivered' && K.owedOf(o) > 0);
      if (un.length) html += card('#/payments', 'cash', money(un.reduce((s, o) => s + K.owedOf(o), 0)) + ' to collect', new Set(un.map(o => o.customer_id)).size + ' shop' + (new Set(un.map(o => o.customer_id)).size > 1 ? 's' : '') + ' still owe money', 'var(--rds)', '#F1C4BF', 'var(--rd)');
    }
    const todo = [K.allow('orders.approve') && 'pending', K.allow('orders.deliver') && 'approved', K.allow('orders.paid') && 'delivered'].filter(Boolean);
    const mine = !todo.length ? orders.filter(o => o.created_by === S.me.id || o.sales_rep_id === S.me.id).slice(0, 4) : orders.filter(o => todo.includes(o.status)).slice(0, 5);
    html += `<div class="sec" style="margin-top:14px"><span>${!todo.length ? 'My latest orders' : 'Needs your action'}</span><a href="#/orders${todo[0] ? '?f=' + todo[0] : ''}">See all</a></div>`;
    html += mine.length ? `<div class="card flush" style="margin-top:10px">${mine.map(orderRow).join('')}</div>` : `<div class="card" style="margin-top:10px">${emptyBox('check', !todo.length ? 'No orders yet. Tap New order to start.' : 'Nothing waiting for you right now.')}</div>`;
    const unreadConvs = convs.filter(c => c.unread).slice(0, 3);
    if (unreadConvs.length) html += `<div class="sec" style="margin-top:18px"><span>New messages</span><a href="#/chat">Open chat</a></div><div class="card flush" style="margin-top:10px">${unreadConvs.map(K.convRow).join('')}</div>`;
    $('#home-rest').innerHTML = html;
  });

  function orderRow(o) {
    return `<a class="list-item" href="#/orders/${o.id}"><div class="ic-av sq">${icon('order', 20)}</div><div class="grow"><div class="tt">${esc(o.order_no)} · ${esc(o.customers ? o.customers.name : '')}</div>
      <div class="st">${esc(K.whoLine(o))} · ${when(o.created_at)}</div></div><div style="text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end"><b>${money(o.total)}</b>${o.status === 'delivered' && +o.paid_amount > 0 ? `<span class="pill or">Part paid · ${money(o.total - o.paid_amount)} left</span>` : statusPill(o.status)}</div></a>`;
  }
  K.orderRow = orderRow;

  // ---------------- More ----------------
  route(/^\/more$/, async () => {
    const item = (href, ic, label, sub, bg = 'var(--ps)', fg = 'var(--p)') => `<a class="list-item" href="${href}"><div class="ic-av sq" style="background:${bg};color:${fg}">${icon(ic, 20)}</div><div class="grow"><div class="tt">${label}</div>${sub ? `<div class="st">${sub}</div>` : ''}</div>${icon('right', 18)}</a>`;
    page({ title: 'More', tab: 'more', body: `<div class="pad">
      <div class="card"><div class="row">${avatar(S.me.full_name)}<div class="grow"><div class="tt">${esc(S.me.full_name)}</div><div class="st">@${esc(S.me.username)} · ${esc(ROLE_LABEL[S.me.role])}</div></div></div></div>
      ${!K.live ? `<div class="demo-note">Demo mode — sample data on this phone only. Nothing is shared with other staff until the real database is connected.</div>` : ''}
      <div class="card flush">
        ${item('#/customers', 'store', 'Customers / shops', 'Shop list, balances, visit history', 'var(--grs)', 'var(--gr)')}
        ${item('#/visits', 'pin', 'Shop visits', K.allow('visits.view_all') ? 'All staff visits' : 'Check in and your visit history', 'var(--bls)', 'var(--bl)')}
        ${K.allow('purchases.manage') || K.allow('purchases.receive') ? item('#/purchases', 'truck', 'From suppliers', 'Purchases and goods arriving', 'var(--bls)', 'var(--bl)') : ''}
        ${K.canCollect() ? item('#/payments', 'cash', 'Money from shops', 'Still owed, collect, check payments', 'var(--grs)', 'var(--gr)') : ''}
        ${item('#/expenses', 'receipt', 'My expenses', 'Gasoline, express, food, guesthouse', 'var(--ors)', 'var(--or)')}
        ${item('#/attendance', 'clock', 'Attendance & leave', 'Start / finish work, days off', 'var(--bls)', 'var(--bl)')}
        ${K.allow('dashboard.view') ? item('#/dashboard', 'chart', 'Dashboard', 'Sales, orders, money owed') : item('#/mydash', 'chart', 'My dashboard', 'My sales, target, ranking, shops')}
        ${can('admin') ? item('#/staff', 'users', 'Staff &amp; roles', 'Approve new staff, set roles', 'var(--ors)', 'var(--or)') : ''}
        ${K.allow('dashboard.view') && K.live ? item('admin.html', 'shield', 'Open admin panel', 'Full reports and management') : ''}
      </div>
      <div class="card"><div class="row"><b class="grow">Language</b></div>${K.langButtons()}<div class="row"><b class="grow">Notifications</b><button class="btn sm out" id="nlist">${icon('bell', 16)}Open</button></div>${K.pushBox()}</div>
      <div class="card flush"><button class="list-item" id="logout" style="color:var(--rd)"><div class="ic-av sq" style="background:var(--rds);color:var(--rd)">${icon('logout', 20)}</div><div class="grow tt">Log out</div></button>
      ${!K.live ? `<button class="list-item" id="reset"><div class="ic-av sq" style="background:#EFEDF4;color:var(--mu)">${icon('refresh', 20)}</div><div class="grow"><div class="tt">Reset demo data</div><div class="st">Start the demo again from the beginning</div></div></button>` : ''}</div>
      <div class="small muted" style="text-align:center">K-TRONiCS Staff · Stage 1</div></div>` });
    $('#nlist').onclick = () => K.openNotifs(); K.bindPush($('#main'));
    $('#logout').onclick = async () => { if (await K.confirmSheet('Log out?', 'You will need your username and password to log in again.', 'Log out', true)) K.logout(); };
    if ($('#reset')) $('#reset').onclick = async () => { if (await K.confirmSheet('Reset demo?', 'All demo changes on this phone will be deleted.', 'Reset', true)) { api.resetDemo(); K.logout(); } };
  });

  // ---------------- Staff (admin) ----------------
  route(/^\/staff$/, async (_, __, current) => {
    if (!can('admin')) return go('#/more');
    const main = page({ title: 'Staff & roles', back: '#/more' });
    const staff = await data.staff(true);
    if (!current()) return;
    const pending = staff.filter(u => !u.active), active = staff.filter(u => u.active);
    const row = u => `<button class="list-item" data-u="${esc(u.id)}">${avatar(u.full_name)}<div class="grow"><div class="tt">${esc(u.full_name)}</div><div class="st">@${esc(u.username)}</div></div>${u.active ? `<span class="pill">${esc(ROLE_LABEL[u.role])}</span>` : '<span class="pill or">Approve</span>'}</button>`;
    main.innerHTML = `<div class="pad">
      <div class="card small muted"><div style="line-height:1.5">New staff tap <b>Create an account</b> on the login screen. They appear here, and you approve them and choose their role. To remove someone who left, open them and tap <b>Disable</b>.</div></div>
      ${pending.length ? `<div class="sec">Waiting for approval (${pending.length})</div><div class="card flush">${pending.map(row).join('')}</div>` : ''}
      <div class="sec">Active staff (${active.length})</div><div class="card flush">${active.map(row).join('')}</div></div>`;
    $$('[data-u]').forEach(b => b.onclick = () => editStaff(staff.find(u => u.id === b.dataset.u)));
  });
  function editStaff(u) {
    const roles = ['sales', 'warehouse', 'driver', 'manager', 'admin'];
    const s = sheet(u.active ? 'Edit staff' : 'Approve staff', `
      <div class="row">${avatar(u.full_name)}<div class="grow"><div class="tt">${esc(u.full_name)}</div><div class="st">@${esc(u.username)}</div></div></div>
      <label class="f">Full name<input class="inp" id="nm" value="${esc(u.full_name)}"></label>
      <div class="f" style="font-size:13px;font-weight:700;color:var(--mu)">Role</div>
      <div class="seg" style="flex-wrap:wrap">${roles.map(r => `<button data-r="${r}" class="${u.role === r ? 'on' : ''}" style="flex:1 0 30%">${ROLE_LABEL[r]}</button>`).join('')}</div>
      <div class="small muted" id="rh"></div>
      <div class="btns">${u.active ? '<button class="btn red" id="dis">Disable</button>' : ''}<button class="btn" id="ok">${u.active ? 'Save' : 'Approve'}</button></div>`);
    let role = u.role;
    const hints = { sales: 'Orders for own shops, visits, chat. Sees stock (view only).', warehouse: 'Packs orders, stock in/out, products.', driver: 'Picks up and delivers orders.', manager: 'Approves orders, sees everything, posts announcements.', admin: 'Everything, plus staff and roles.' };
    const setHint = () => { $('#rh', s.el).textContent = hints[role]; };
    setHint();
    $$('[data-r]', s.el).forEach(b => b.onclick = () => { role = b.dataset.r; $$('[data-r]', s.el).forEach(x => x.classList.toggle('on', x === b)); setHint(); });
    const saveIt = async (btn, active) => {
      await busy(btn, () => api.updateStaff(u.id, role, active, $('#nm', s.el).value));
      s.close(); toast(active ? 'Saved' : 'Account disabled'); K.forget('staff'); K.render();
    };
    $('#ok', s.el).onclick = e => saveIt(e.currentTarget, true);
    if ($('#dis', s.el)) $('#dis', s.el).onclick = e => saveIt(e.currentTarget, false);
  }

  // ---------------- Dashboard ----------------
  route(/^\/dashboard$/, async (_, __, current) => {
    if (!K.allow('dashboard.view')) return go('#/home');
    const main = page({ title: 'Dashboard', sub: 'Today · all branches', back: '#/more' });
    const [d, team] = await Promise.all([api.dashboard(), api.teamSales(K.monthKey())]); d.team = team;
    if (!current()) return;
    const tile = (v, l, color, href) => `<a class="stat" href="${href || '#/dashboard'}" style="text-decoration:none;color:inherit"><b style="${color ? 'color:' + color : ''}">${v}</b><span>${l}</span></a>`;
    const max = Math.max(1, ...d.last7.map(x => +x.total));
    main.innerHTML = `<div class="pad">
      <div class="stats">${tile(money(d.sales_today), 'Sales today', null, '#/orders?p=today')}${tile(d.orders_today, 'Orders today', null, '#/orders?p=today')}
        ${tile(d.pending_orders, 'Waiting approval', d.pending_orders ? 'var(--or)' : null, '#/orders?f=pending')}${tile(money(d.owed_total), 'Still owed by shops', d.owed_total ? 'var(--rd)' : null, '#/payments')}
        ${tile(money(d.collected_today || 0), 'Collected today', d.collected_today ? 'var(--gr)' : null, '#/payments?t=history')}${tile(d.payments_pending || 0, 'Payments to check', d.payments_pending ? 'var(--or)' : null, '#/payments?t=check')}
        ${tile(d.visits_today, 'Shop visits today', null, '#/visits')}${tile(d.low_stock, 'Low stock items', d.low_stock ? 'var(--or)' : null, '#/stock?low=1')}</div>
      <div class="card"><div class="row"><b class="grow">Sales, last 7 days</b></div>
        <div style="display:flex;align-items:flex-end;gap:10px;height:150px;border-bottom:1px solid var(--line)">${d.last7.map((x, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${money(x.total)}"><div style="font-size:10px;color:var(--mu);margin-bottom:3px">${+x.total ? Math.round(x.total) : ''}</div><div style="width:100%;max-width:34px;height:${Math.max(2, (+x.total / max) * 120)}px;border-radius:6px 6px 0 0;background:${i === 6 ? 'var(--p)' : '#C9BEF7'}"></div></div>`).join('')}</div>
        <div style="display:flex;gap:10px">${d.last7.map((x, i) => `<div style="flex:1;text-align:center;font-size:11px;color:var(--mu);font-weight:${i === 6 ? 800 : 600}">${new Date(x.day + 'T00:00:00').toLocaleDateString([], { weekday: 'short' })}</div>`).join('')}</div></div>
      <div class="card"><div class="row"><b class="grow">Sales targets · this month</b><button class="btn sm out" id="tg">Set targets</button></div>${K.rankingHtml((d.team || []).map(r => ({ id: r.user_id, name: r.full_name, total: r.total, target: r.target })), null, { targets: true })}</div>
      <div class="card"><b>Top sales staff (30 days)</b>${d.top_staff.length ? d.top_staff.map(t => `<div class="row">${avatar(t.name, 'sm')}<div class="grow tt" style="font-size:14px">${esc(t.name)}</div><b>${money(t.total)}</b></div>`).join('') : '<div class="muted small">No sales yet</div>'}</div>
      <a class="card" href="#/staff" style="text-decoration:none;color:inherit"><div class="row"><div class="ic-av sq">${icon('users', 20)}</div><div class="grow"><div class="tt">${d.staff_active} active staff</div><div class="st">${d.staff_pending ? d.staff_pending + ' waiting for approval' : 'No one waiting'}</div></div>${icon('right', 18)}</div></a></div>`;
    $('#tg').onclick = () => K.targetsSheet(() => K.render());
  });
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
</html>
