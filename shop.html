:root{--bg:var(--tg-theme-secondary-bg-color,#f3f4f6);--card:var(--tg-theme-bg-color,#fff);--ink:var(--tg-theme-text-color,#111);--mu:var(--tg-theme-hint-color,#6b7280);
  --p:#D7141A;--ps:#fde8e8;--gr:#15803d;--grs:#dcfce7;--or:#b45309;--ors:#fef3c7;--line:rgba(127,127,127,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans Khmer",system-ui,sans-serif;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
.muted{color:var(--mu)}.small{font-size:13px}.red{color:var(--p);font-weight:700}.ink{color:var(--ink)}.grow{flex:1;min-width:0}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}
.center h2{margin:4px 0 0;font-size:20px}.center p{margin:0;max-width:340px;line-height:1.5}.center-t{text-align:center}
.bigicon{font-size:52px}.bigicon.ok{width:74px;height:74px;border-radius:50%;background:var(--grs);color:var(--gr);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{height:34px;max-width:110px;object-fit:contain}.logo.txt{width:34px;border-radius:10px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.shopname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.owe{display:flex;justify-content:space-between;gap:8px;width:calc(100% - 28px);margin:10px 14px 0;padding:10px 12px;border-radius:12px;border:0;background:var(--ps);color:#991b1b;font-size:14px;cursor:pointer}
.owe .od{font-weight:700}
.welcome{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:var(--card);font-size:14px;line-height:1.5}
main{padding:12px 14px 92px;display:flex;flex-direction:column;gap:12px}
.searchbar input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}
.prod{display:flex;flex-direction:column;gap:6px;padding:10px}.prod.dim{opacity:.55}
.prod img,.prod .ph{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:var(--bg)}
.ph{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--mu);background:linear-gradient(135deg,var(--bg),var(--line))}
.pn{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row.big{font-size:18px}
.price{font-size:15px}.st{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.st.in{background:var(--grs);color:var(--gr)}.st.low{background:var(--ors);color:var(--or)}.st.out{background:var(--ps);color:var(--p)}
.add{width:100%;padding:9px;border-radius:10px;border:0;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.add:disabled{background:var(--line);color:var(--mu)}
.step{display:flex;align-items:center;border:1.5px solid var(--p);border-radius:10px;overflow:hidden}
.step button{width:36px;height:36px;border:0;background:var(--ps);color:var(--p);font-size:20px;font-weight:800;cursor:pointer}
.step input{flex:1;min-width:0;width:44px;text-align:center;border:0;background:transparent;font-weight:800;outline:none}
.list{padding:4px 12px}.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}
.line img,.line .ph{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none;font-size:14px}.line .step{width:118px;flex:none}
.lbl{font-weight:700;margin-bottom:8px}.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}.radio input{accent-color:var(--p);width:18px;height:18px;margin-top:2px;flex:none}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical;outline:none}
.warn{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ors);color:var(--or);font-size:13px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:12px;border:0;background:var(--p);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}
.btn.block{width:100%}.btn.out{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 12px;font-size:13px}.btn:disabled{opacity:.5}
.ord{cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--bg);white-space:nowrap}
.p-pending{background:var(--ors);color:var(--or)}.p-approved,.p-packed,.p-delivering{background:#dbeafe;color:#1d4ed8}.p-delivered{background:#ede9fe;color:#6d28d9}
.p-paid{background:var(--grs);color:var(--gr)}.p-cancelled,.p-returned{background:var(--ps);color:var(--p)}
.items{display:flex;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}.items .btn{margin-top:4px}
.qr{text-align:center}.qr img{max-width:220px;width:100%;border-radius:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;border:0;background:none;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--mu);cursor:pointer}
.tabs button.on{color:var(--p)}.tabs .ic{font-size:21px;position:relative;line-height:1.1}
.badge{position:absolute;top:-4px;right:-12px;background:var(--p);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 6px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--mu)}
.form input,.form select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:400;outline:none;-webkit-appearance:none;appearance:none}
.btn.done{background:var(--grs);color:var(--gr)}
.gpsbox{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.gpsbox b{font-size:14px;color:var(--ink)}.okc{color:var(--gr);font-weight:700}
</style>
</head>

    return khqr + (orders.map(o => { const owe = ['approved', 'packed', 'delivering', 'delivered'].includes(o.status) ? o.total - o.paid : 0;
      const d = new Date(o.created_at).toLocaleDateString(lang === 'km' ? 'km-KH' : 'en-GB', { day: 'numeric', month: 'short' });
      return `<div class="card ord" data-o="${o.id}"><div class="row"><b>${esc(o.order_no)}</b><span class="pill p-${o.status}">${esc(T.st[o.status] || o.status)}</span></div>
        <div class="row small muted"><span>${d} · ${(o.items || []).length} ${esc(T.items)}</span><b class="ink">${money(o.total)}</b></div>
        ${owe > 0 ? `<div class="row small"><span class="red">${esc(T.owe)} ${money(owe)}</span>${o.due_date ? `<span class="${o.due_date < new Date().toISOString().slice(0, 10) ? 'red' : 'muted'}">${esc(T.due(o.due_date))}</span>` : ''}</div>` : ''}
        ${openOrder === o.id ? `<div class="items">${(o.items || []).map(i => `<div class="row small"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.qty * i.price)}</span></div>`).join('')}
          <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn out sm" data-again="${o.id}">↻ ${esc(T.again)}</button>${chatLink() ? `<button class="btn out sm" data-ask="${o.id}">${esc(T.askOrder)}</button>` : ''}</div></div>` : ''}</div>`; }).join('') || `<div class="center"><div class="bigicon">📄</div><p class="muted">${esc(T.noOrders)}</p></div>`);
  }
  async function loadOrders() { try { orders = await rpc('shop_orders'); } catch (e) { orders = []; toast(e.message); } if (tab === 'orders') draw(); }

  // ---------- actions ----------
  function setQty(id, q) {
    const p = products.find(x => String(x.id) === String(id)); if (!p) return;
    q = Math.max(0, Math.floor(+q || 0));
    if (q > p.qty) { q = p.qty; toast(t().maxQty(p.qty)); }
    if (q) cart[p.id] = q; else delete cart[p.id];
    saveCart(); haptic(); draw();
  }
  function bind() {
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; if (tab === 'orders') orders = null; window.scrollTo(0, 0); draw(); });
    const L = document.getElementById('lang'); if (L) L.onclick = () => { lang = lang === 'km' ? 'en' : 'km'; store.set('kts_lang', lang); draw(); };
    const Q = document.getElementById('q'); if (Q) Q.oninput = e => { search = e.target.value; const pos = e.target.selectionStart; draw(); const n = document.getElementById('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} };
    root.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { cat = b.dataset.cat; draw(); });
    root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => setQty(b.dataset.add, 1));
    root.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => setQty(b.dataset.inc, (cart[b.dataset.inc] || 0) + 1));
    root.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => setQty(b.dataset.dec, (cart[b.dataset.dec] || 0) - 1));
    root.querySelectorAll('[data-qty]').forEach(i => i.onchange = () => setQty(i.dataset.qty, i.value));
    root.querySelectorAll('input[name=pm]').forEach(r => r.onchange = () => { payMode = r.value; });
    const N = document.getElementById('note'); if (N) N.oninput = e => { note = e.target.value; };
    const B = document.getElementById('send'); if (B) B.onclick = send;
    const NT = document.getElementById('notify'); if (NT) NT.onclick = askUpdates;
    const CH = document.getElementById('chatnow'); if (CH) CH.onclick = openChat;
    root.querySelectorAll('[data-ask]').forEach(b => b.onclick = e => { e.stopPropagation(); openChat(); });
    root.querySelectorAll('[data-o]').forEach(c => c.onclick = e => { if (e.target.closest('[data-again],[data-ask]')) return; openOrder = openOrder === +c.dataset.o ? null : +c.dataset.o; draw(); });
    root.querySelectorAll('[data-again]').forEach(b => b.onclick = () => {
      const o = orders.find(x => x.id === +b.dataset.again); let added = 0;
      (o.items || []).forEach(i => { const p = products.find(x => x.name === i.name && x.qty > 0); if (p) { cart[p.id] = Math.min(p.qty, (cart[p.id] || 0) + i.qty); added++; } });
      saveCart(); toast(t().addedCart); tab = 'cart'; draw(); });
  }
  function mainButton() {
    if (!TG || !TG.MainButton || DEMO) return;
    const MB = TG.MainButton, tot = cartTotal(), min = +S.settings.min_order || 0;
    MB.offClick(send); MB.offClick(goCart);
    if (tab === 'cart' && cartLines().length && !(min && tot < min)) { MB.setText(t().send + ' · ' + money(tot)); MB.onClick(send); MB.show(); MB.enable(); }
    else if (tab === 'products' && cartCount()) { MB.setText('🛒 ' + t().cart + ' (' + cartCount() + ') · ' + money(tot)); MB.onClick(goCart); MB.show(); MB.enable(); }
    else MB.hide();
  }
  function goCart() { tab = 'cart'; draw(); }
  async function send() {
    if (busy) return; const lines = cartLines(); if (!lines.length) return;
    busy = true; const B = document.getElementById('send'); if (B) { B.disabled = true; B.textContent = t().sending; }
    if (TG && TG.MainButton && !DEMO) TG.MainButton.showProgress();
    try {
      lastOrder = await rpc('shop_place_order', { p_items: lines.map(l => ({ product_id: l.p.id, qty: l.q })), p_payment: payMode, p_note: note || null });
      cart = {}; note = ''; saveCart(); haptic('ok');
      products = await rpc('shop_catalog').catch(() => products);
      S.balance.waiting = (+S.balance.waiting || 0) + 1;
      tab = 'done'; draw();
      if (lastOrder.pay_choice === 'chat') setTimeout(openChat, 600);
    } catch (e) { toast(e.message); if (B) { B.disabled = false; B.textContent = t().send; } }
    finally { busy = false; if (TG && TG.MainButton && !DEMO) TG.MainButton.hideProgress(); }
  }
  function askUpdates() {
    const done = ok => { if (!ok) return; S.me.can_message = true; rpc('shop_set_notify', { p_on: true }).catch(() => {}); draw(); };
    if (TG && TG.requestWriteAccess && !DEMO) { try { TG.requestWriteAccess(done); return; } catch (e) {} }
    done(true);
  }
  if (TG && TG.BackButton) { TG.BackButton.onClick(() => { tab = 'products'; draw(); }); }
  const _draw = draw; draw = function () { _draw(); if (TG && TG.BackButton && !DEMO) { tab === 'products' ? TG.BackButton.hide() : TG.BackButton.show(); } };
  start();
})();
</script>
</body>
