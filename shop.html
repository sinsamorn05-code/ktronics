/* K-TRONiCS Telegram shop — two looks: .th-a Clean (light) and .th-b Bold (black) */
:root,.th-a{--bg:#F4F4F6;--card:#FFFFFF;--ink:#16161A;--mu:#62626C;--line:#E6E6EA;--p:#D7141A;--pd:#B80F14;--ps:#FDECEC;--gr:#127A3E;--grs:#E7F5EC;--or:#8A5A00;--ors:#FFF4DB;
  --bl:#1D4ED8;--bls:#E6EDFF;--vi:#6D28D9;--vis:#EFE9FF;--img:#F1F1F4;--imgic:#9A9AA6;--sh:0 1px 2px rgba(20,20,30,.05),0 6px 18px rgba(20,20,30,.05);--bd:0 solid transparent;
  --hbg:#FFFFFF;--hink:#16161A;--hmu:#62626C;--hline:#E6E6EA;--tbg:#FFFFFF;--tink:#7A7A85;--ton:#D7141A;--tonbg:#FDECEC;--tonic:#D7141A;--addbg:#16161A;--r:18px;
  --disp:"Plus Jakarta Sans","Noto Sans Khmer",system-ui,sans-serif;--segbg:#E8E8EC}
.th-b{--bg:#EEEDEA;--card:#FFFFFF;--ink:#131316;--mu:#5F5E66;--line:#E1DFDB;--p:#E3161D;--pd:#B80F14;--ps:#FDE9E9;--gr:#127A3E;--grs:#E4F3E9;--or:#8A5A00;--ors:#FFF1D6;
  --img:#F3F2EF;--imgic:#8E8C94;--sh:0 1px 0 rgba(0,0,0,.03);--bd:1px solid #E1DFDB;
  --hbg:#131316;--hink:#FFFFFF;--hmu:#A9A8B0;--hline:transparent;--tbg:#131316;--tink:#9B9AA3;--ton:#FFFFFF;--tonbg:#E3161D;--tonic:#FFFFFF;--addbg:#E3161D;--r:14px;
  --disp:"Space Grotesk","Noto Sans Khmer","Plus Jakarta Sans",system-ui,sans-serif;--segbg:#E2E1DE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans Khmer",system-ui,sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.muted{color:var(--mu)}.small{font-size:13px}.red{color:var(--p);font-weight:700}.ink{color:var(--ink)}.grow{flex:1;min-width:0}.okc{color:var(--gr);font-weight:700}
.center{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px 8px}
.center.small-c{min-height:0;padding:30px 8px}
.center h2{margin:4px 0 0;font-size:21px;font-family:var(--disp);font-weight:800}.center p{margin:0;max-width:340px;line-height:1.5}.center-t{text-align:center}
.bigic{width:76px;height:76px;border-radius:24px;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center}
.bigic svg{width:38px;height:38px}.bigic.ok{border-radius:50%;background:var(--grs);color:var(--gr)}.bigic.ok svg{stroke-width:2.6}.bigic.amber{background:var(--ors);color:var(--or)}
.bigicon{font-size:52px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--hbg);color:var(--hink);border-bottom:1px solid var(--hline);padding:12px 16px}
.toprow{display:flex;align-items:center;gap:12px}
.ktile{width:38px;height:38px;border-radius:11px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:19px;flex:none}
.shopname{font-weight:800;font-size:16px;font-family:var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:12.5px;color:var(--hmu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langb{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--hink);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;flex:none}
.langb svg{width:16px;height:16px}
.th-b .langb{border-color:rgba(255,255,255,.18)}
.top.tall{border-radius:0 0 26px 26px;padding-bottom:16px;position:relative}
.top.tall .search{margin-top:14px;background:rgba(255,255,255,.09);box-shadow:none;color:var(--hmu)}
.top.tall .search input{color:#fff}.top.tall .search input::placeholder{color:var(--hmu)}
.logo{display:none}

/* page */
main{padding:14px 16px 112px;display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);color:var(--mu);box-shadow:var(--sh);border:var(--bd)}
.search svg{width:20px;height:20px}.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:15px;color:var(--ink);-webkit-appearance:none;appearance:none}
.notice{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;border:0;text-align:left;width:calc(100% - 32px);max-width:728px}
.notice svg{width:17px;height:17px}.notice.amber{background:var(--ors);color:var(--or)}.notice.red{background:var(--ps);color:#991b1b;cursor:pointer}.notice.plain{background:var(--card);color:var(--ink);line-height:1.5}
@media(min-width:792px){.notice{margin-left:auto;margin-right:auto}}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);border:var(--bd);box-shadow:var(--sh);text-align:left;width:100%;color:var(--ink)}
.rowcard b{display:block;font-size:14px}.rowcard .small{display:block;margin-top:2px}.rowcard svg{width:20px;height:20px}
.rico{width:44px;height:44px;border-radius:12px;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center;flex:none}
.rico svg{width:22px;height:22px}.rico.orange{background:#FFF0E3;color:#C2410C}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sect h2{margin:0;font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.01em}.sect span{font-size:13px;font-weight:700;color:var(--mu)}
.pagetitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pagetitle h1{margin:0;font-family:var(--disp);font-size:24px;font-weight:800}.pagetitle span{font-size:13px;color:var(--mu)}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:var(--bd);display:flex;flex-direction:column;gap:6px}
.card.wide,.wide{width:100%;max-width:380px}

/* cart */
.lines{padding:2px 14px;gap:0}
.cline{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.cline:last-child{border-bottom:0}
.cline img.cimg,.cline .ph.cimg{width:60px;height:60px;border-radius:12px;object-fit:cover;flex:none}.cline .ph.cimg svg{width:24px;height:24px;stroke-width:1.6}

textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);resize:vertical;outline:none;font-size:15px;color:var(--ink)}
.warn{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ors);color:var(--or);font-size:13px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;border:0;background:var(--p);color:#fff;font-weight:800;font-size:15px;text-decoration:none;min-height:46px}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}.btn.out{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:11px}.btn.sm svg{width:15px;height:15px}
.btn:disabled{opacity:.5}.btn.green{background:var(--gr)}.btn.done{background:var(--grs);color:var(--gr)}
.btn.big{min-height:56px;border-radius:16px;font-size:16px;justify-content:space-between;padding:0 20px;box-shadow:0 8px 20px rgba(215,20,26,.28)}
.btn.big:disabled{box-shadow:none}

/* done */
.center.done{gap:12px}.bigno{font-size:16px}

/* me */
.seg{display:flex;padding:4px;gap:4px;border-radius:13px;background:var(--segbg)}

.acct{border-radius:calc(var(--r) + 2px);padding:16px;background:var(--card);box-shadow:var(--sh);border:var(--bd);display:flex;flex-direction:column;gap:14px}
.th-b .acct{background:var(--hbg);color:#fff;border:0}
.arow{display:flex;align-items:center;gap:12px}.arow b{font-size:15px}.amu{color:var(--mu)}.th-b .amu{color:var(--hmu)}
.aic{width:44px;height:44px;border-radius:50%;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center;flex:none}.aic svg{width:22px;height:22px}
.chipst{padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}.chipst.green{background:var(--grs);color:var(--gr)}.chipst.amber{background:var(--ors);color:var(--or)}
.astats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.astats div{display:flex;flex-direction:column;gap:2px;min-width:0}.astats b{font-family:var(--disp);font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astats span{font-size:11.5px;color:var(--mu);font-weight:600}.th-b .astats span{color:var(--hmu)}
.redv{color:var(--p)}.greenv{color:var(--gr)}.th-b .greenv{color:#6EE7A0}.th-b .redv{color:#FF7B7F}
.ord{cursor:pointer;gap:8px}.orow{display:flex;gap:12px;align-items:center}.orow .row+.row{margin-top:2px}.orow .price{font-size:15px}
.oic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}.oic svg{width:20px;height:20px;stroke-width:2}
.oic.amber,.stt.amber{background:var(--ors);color:var(--or)}.oic.blue{background:var(--bls);color:var(--bl)}.oic.green{background:var(--grs);color:var(--gr)}.oic.violet{background:var(--vis);color:var(--vi)}.oic.grey{background:var(--bg);color:var(--mu)}
.stt{font-weight:700;background:none!important}.stt.blue{color:var(--bl)}.stt.green{color:var(--gr)}.stt.violet{color:var(--vi)}.stt.grey{color:var(--mu)}
.owe1{padding-left:54px}
.items{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}.items .btn{margin-top:4px}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--bg);white-space:nowrap}
.p-pending{background:var(--ors);color:var(--or)}.p-approved,.p-packed,.p-delivering{background:var(--bls);color:var(--bl)}.p-delivered{background:var(--vis);color:var(--vi)}
.p-paid{background:var(--grs);color:var(--gr)}.p-cancelled,.p-returned{background:var(--ps);color:var(--p)}
.kv{justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.kv>span:last-child{text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 6px}.stats div{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:15px;color:var(--ink);font-family:var(--disp)}.stats span{font-size:11.5px;color:var(--mu)}
.welcome{padding:10px 12px;border-radius:12px;background:var(--card);font-size:14px;line-height:1.5}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lookopt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left}

.lookprev{width:100%;height:64px;border-radius:10px;display:flex;flex-direction:column;gap:5px;padding:7px;overflow:hidden}

.lp-a{background:#F4F4F6;border:1px solid #E6E6EA}.lp-a i:nth-child(1){height:12px;background:#fff}.lp-a i:nth-child(2){height:18px;background:#fff;width:70%}.lp-a i:nth-child(3){height:10px;width:40%;background:#D7141A}
.lp-b{background:#EEEDEA}.lp-b i:nth-child(1){height:16px;background:#131316;margin:-7px -7px 0;border-radius:0 0 8px 8px}.lp-b i:nth-child(2){height:16px;background:#fff;width:70%}.lp-b i:nth-child(3){height:10px;width:40%;background:#E3161D}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--tbg);border-top:1px solid var(--line);padding:7px 4px calc(8px + env(safe-area-inset-bottom));z-index:6}
.th-b .tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));border:0;border-radius:24px;padding:7px 4px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.tabs button{flex:1;border:0;background:none;padding:3px 0 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--tink);min-width:0}
.tabs .tl2{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tabs .ic{position:relative;width:50px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .15s}

.cic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:var(--ps);color:var(--p);flex:none}.cic svg{width:24px;height:24px}

/* chat */

  function setQty(id, q) {
    const p = products.find(x => String(x.id) === String(id)); if (!p) return;
    q = Math.max(0, Math.floor(+q || 0));
    if (q > 100000) q = 100000;
    if (q) cart[p.id] = q; else delete cart[p.id];
    saveCart(); haptic(); draw();
  }

      if (tab === 'products' && was === 'products' && b.closest('.tabs')) { cat = ''; search = ''; } if (tab === 'chat' && was !== 'chat') CHAT = null; window.scrollTo(0, 0); draw(); });
    if (tab === 'me') bindMe();
    if (tab === 'pre' || tab === 'orders' || tab === 'preorders') bindPre();

    const Q = document.getElementById('q'); if (Q) Q.oninput = e => { search = e.target.value; const pos = e.target.selectionStart; draw(); const n = document.getElementById('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} };
    root.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { cat = b.dataset.cat; draw(); });
    root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => setQty(b.dataset.add, 1));
    root.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => setQty(b.dataset.inc, (cart[b.dataset.inc] || 0) + 1));
    root.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => setQty(b.dataset.dec, (cart[b.dataset.dec] || 0) - 1));
    root.querySelectorAll('[data-qty]').forEach(i => i.onchange = () => setQty(i.dataset.qty, i.value));
    root.querySelectorAll('input[name=pm]').forEach(r => r.onchange = () => { payMode = r.value; });
    const N = document.getElementById('note'); if (N) N.oninput = e => { note = e.target.value; };
    const B = document.getElementById('send'); if (B) B.onclick = send;
    const NT = document.getElementById('notify'); if (NT) NT.onclick = askUpdates;
    const CH = document.getElementById('chatnow'); if (CH) CH.onclick = openChat;
    root.querySelectorAll('[data-ask]').forEach(b => b.onclick = e => { e.stopPropagation(); openChat(); });
    root.querySelectorAll('[data-o]').forEach(c => c.onclick = e => { if (e.target.closest('[data-again],[data-ask]')) return; openOrder = openOrder === +c.dataset.o ? null : +c.dataset.o; draw(); });

      (o.items || []).filter(i => +i.price > 0).forEach(i => { const p = products.find(x => x.name === i.name); if (p) { cart[p.id] = Math.min(maxPaid(p), (cart[p.id] || 0) + i.qty); added++; } });
      saveCart(); toast(t().addedCart); tab = 'cart'; draw(); });
  }

    try {
      lastOrder = await rpc('shop_place_order', { p_items: lines.map(l => ({ product_id: l.p.id, qty: l.q })), p_payment: payMode, p_note: note || null });
      cart = {}; note = ''; saveCart(); haptic('ok');
      products = await rpc('shop_catalog').catch(() => products);
      S.balance.waiting = (+S.balance.waiting || 0) + 1;
      rpc('shop_start').then(x => { if (x && x.offers) S.offers = x.offers; }).catch(() => {});   // e.g. the first-order offer is used now
      tab = 'done'; draw();
      if (lastOrder.pay_choice === 'chat') setTimeout(openChat, 600);
    } catch (e) { toast(e.message); if (B) { B.disabled = false; B.textContent = t().send; } }
    finally { busy = false; if (TG && TG.MainButton && !DEMO) TG.MainButton.hideProgress(); }
  }
  function askUpdates() {
    const done = ok => { if (!ok) return; S.me.can_message = true; if (prof) prof.can_message = true; rpc('shop_set_notify', { p_on: true }).catch(() => {}); draw(); };
    if (TG && TG.requestWriteAccess && !DEMO) { try { TG.requestWriteAccess(done); return; } catch (e) {} }
    done(true);
  }
  if (TG && TG.BackButton) { TG.BackButton.onClick(() => { tab = 'products'; draw(); }); }
  const _draw = draw; draw = function () { _draw(); if (TG && TG.BackButton && !DEMO) { tab === 'products' ? TG.BackButton.hide() : TG.BackButton.show(); } };
  start();
})();
</script>
