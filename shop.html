/* K-TRONiCS Telegram shop — two looks: .th-a Clean (light) and .th-b Bold (black) */
:root,.th-a{--bg:#F4F4F6;--card:#FFFFFF;--ink:#16161A;--mu:#62626C;--line:#E6E6EA;--p:#D7141A;--pd:#B80F14;--ps:#FDECEC;--gr:#127A3E;--grs:#E7F5EC;--or:#8A5A00;--ors:#FFF4DB;
  --bl:#1D4ED8;--bls:#E6EDFF;--vi:#6D28D9;--vis:#EFE9FF;--img:#F1F1F4;--imgic:#9A9AA6;--sh:0 1px 2px rgba(20,20,30,.05),0 6px 18px rgba(20,20,30,.05);--bd:0 solid transparent;
  --hbg:#FFFFFF;--hink:#16161A;--hmu:#62626C;--hline:#E6E6EA;--tbg:#FFFFFF;--tink:#7A7A85;--ton:#D7141A;--tonbg:#FDECEC;--tonic:#D7141A;--addbg:#16161A;--r:18px;
  --disp:"Plus Jakarta Sans","Noto Sans Khmer",system-ui,sans-serif;--segbg:#E8E8EC}
.th-b{--bg:#EEEDEA;--card:#FFFFFF;--ink:#131316;--mu:#5F5E66;--line:#E1DFDB;--p:#E3161D;--pd:#B80F14;--ps:#FDE9E9;--gr:#127A3E;--grs:#E4F3E9;--or:#8A5A00;--ors:#FFF1D6;
  --img:#F3F2EF;--imgic:#8E8C94;--sh:0 1px 0 rgba(0,0,0,.03);--bd:1px solid #E1DFDB;
  --hbg:#131316;--hink:#FFFFFF;--hmu:#A9A8B0;--hline:transparent;--tbg:#131316;--tink:#9B9AA3;--ton:#FFFFFF;--tonbg:#E3161D;--tonic:#FFFFFF;--addbg:#E3161D;--r:14px;
  --disp:"Space Grotesk","Noto Sans Khmer","Plus Jakarta Sans",system-ui,sans-serif;--segbg:#E2E1DE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans Khmer",system-ui,sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.muted{color:var(--mu)}.small{font-size:13px}.red{color:var(--p);font-weight:700}.ink{color:var(--ink)}.grow{flex:1;min-width:0}.okc{color:var(--gr);font-weight:700}
.center{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px 8px}
.center.small-c{min-height:0;padding:30px 8px}
.center h2{margin:4px 0 0;font-size:21px;font-family:var(--disp);font-weight:800}.center p{margin:0;max-width:340px;line-height:1.5}.center-t{text-align:center}
.bigic{width:76px;height:76px;border-radius:24px;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center}
.bigic svg{width:38px;height:38px}.bigic.ok{border-radius:50%;background:var(--grs);color:var(--gr)}.bigic.ok svg{stroke-width:2.6}.bigic.amber{background:var(--ors);color:var(--or)}
.bigicon{font-size:52px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--hbg);color:var(--hink);border-bottom:1px solid var(--hline);padding:12px 16px}
.toprow{display:flex;align-items:center;gap:12px}
.ktile{width:38px;height:38px;border-radius:11px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:19px;flex:none}
.shopname{font-weight:800;font-size:16px;font-family:var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:12.5px;color:var(--hmu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langb{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--hink);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;flex:none}
.langb svg{width:16px;height:16px}
.th-b .langb{border-color:rgba(255,255,255,.18)}
.top.tall{border-radius:0 0 26px 26px;padding-bottom:16px;position:relative}
.top.tall .search{margin-top:14px;background:rgba(255,255,255,.09);box-shadow:none;color:var(--hmu)}
.top.tall .search input{color:#fff}.top.tall .search input::placeholder{color:var(--hmu)}
.logo{display:none}

/* page */
main{padding:14px 16px 112px;display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);color:var(--mu);box-shadow:var(--sh);border:var(--bd)}
.search svg{width:20px;height:20px}.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:15px;color:var(--ink);-webkit-appearance:none;appearance:none}
.notice{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;border:0;text-align:left;width:calc(100% - 32px);max-width:728px}
.notice svg{width:17px;height:17px}.notice.amber{background:var(--ors);color:var(--or)}.notice.red{background:var(--ps);color:#991b1b;cursor:pointer}.notice.plain{background:var(--card);color:var(--ink);line-height:1.5}
@media(min-width:792px){.notice{margin-left:auto;margin-right:auto}}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);border:var(--bd);box-shadow:var(--sh);text-align:left;width:100%;color:var(--ink)}
.rowcard b{display:block;font-size:14px}.rowcard .small{display:block;margin-top:2px}.rowcard svg{width:20px;height:20px}
.rico{width:44px;height:44px;border-radius:12px;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center;flex:none}
.rico svg{width:22px;height:22px}.rico.orange{background:#FFF0E3;color:#C2410C}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sect h2{margin:0;font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.01em}.sect span{font-size:13px;font-weight:700;color:var(--mu)}
.pagetitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pagetitle h1{margin:0;font-family:var(--disp);font-size:24px;font-weight:800}.pagetitle span{font-size:13px;color:var(--mu)}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:var(--bd);display:flex;flex-direction:column;gap:6px}
.card.wide,.wide{width:100%;max-width:380px}
.lbl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:6px}.lbl.m0{margin:0}
.lic{width:30px;height:30px;border-radius:9px;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center;flex:none}.lic svg{width:17px;height:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row.big{font-size:18px}
.iconl{display:inline-flex;align-items:center;gap:6px}.iconl svg{width:16px;height:16px}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.pcard{background:var(--card);border-radius:var(--r);padding:8px;box-shadow:var(--sh);border:var(--bd);display:flex;flex-direction:column;gap:8px}
.pimg{position:relative}
.pimg img,.pimg .ph{width:100%;aspect-ratio:1/0.84;border-radius:calc(var(--r) - 6px);object-fit:cover;background:var(--img)}.pimg img{display:block}
.ph{display:flex!important;align-items:center;justify-content:center;background:var(--img);color:var(--imgic)}
.pimg .ph svg{width:34px;height:34px;stroke-width:1.5}
.addc{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;border:0;background:var(--addbg);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:transform .12s}
.addc svg{width:19px;height:19px;stroke-width:2.6}.addc:active{transform:scale(.9)}
.corner{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:8px;color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em}
.corner.red{background:var(--p)}.corner.green{background:var(--gr)}
.pbody{padding:0 4px 4px;display:flex;flex-direction:column;gap:5px}
.pcat{font-size:11.5px;color:var(--mu);font-weight:600}
.pn{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbody .pn{min-height:36px}
.prow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-family:var(--disp);font-weight:800;font-size:17px}.price.sale,.sale{color:var(--p)}
.was{font-size:12px;color:var(--mu)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:700;align-self:flex-start;line-height:1.3}
.tag svg{width:13px;height:13px;stroke-width:2.2}.tag.red{background:var(--ps);color:var(--p)}.tag.green{background:var(--grs);color:var(--gr)}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:999px;height:38px;padding:0 4px}
.qty button{width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.qty button svg{width:16px;height:16px;stroke-width:2.4}
.qty input{width:48px;min-width:0;text-align:center;border:0;background:transparent;color:#fff;font-weight:800;font-size:14.5px;outline:none}
.qty.sm{background:transparent;color:var(--ink);border:1px solid var(--line);height:34px;padding:0 2px}
.qty.sm button{background:transparent;color:var(--ink);width:28px;height:28px}.qty.sm input{color:var(--ink);width:40px;font-size:13.5px}

/* promotions */
.hero{position:relative;overflow:hidden;border-radius:calc(var(--r) + 4px);padding:18px;background:var(--p);color:#fff;display:flex;flex-direction:column;gap:6px}
.th-b .hero{background:var(--hbg)}
.hero .blob{position:absolute;right:-24px;top:-24px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.10)}
.th-b .hero .blob{background:rgba(227,22,29,.35)}
.hero .hic{position:absolute;right:18px;top:18px;color:rgba(255,255,255,.92)}.hero .hic svg{width:34px;height:34px;stroke-width:1.8}
.kick{font-size:12px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.8)}
.htitle{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1.15;max-width:250px}
.hsub2{font-size:13px;color:rgba(255,255,255,.86);max-width:280px;line-height:1.45}
.coupon{display:flex;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:var(--bd);overflow:hidden}
.cleft{width:92px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;border-right:2px dashed var(--card);text-align:center}
.coupon.t-red .cleft{background:var(--ps);color:var(--p)}.coupon.t-green .cleft{background:var(--grs);color:var(--gr)}
.cleft svg{width:22px;height:22px;stroke-width:2}
.cleft b{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1}.cleft b.long{font-size:17px}
.cleft span{font-size:10.5px;font-weight:800;letter-spacing:.05em}
.cright{padding:12px 14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.cright>b{font-size:14.5px;line-height:1.3}.cright>span{font-size:12.5px;color:var(--mu);line-height:1.4}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--p)}.coupon.t-green .bar i{background:var(--gr)}
.barl{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mu);font-weight:600}

/* cart */
.lines{padding:2px 14px;gap:0}
.cline{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.cline:last-child{border-bottom:0}
.cline img.cimg,.cline .ph.cimg{width:60px;height:60px;border-radius:12px;object-fit:cover;flex:none}.cline .ph.cimg svg{width:24px;height:24px;stroke-width:1.6}
.cline .pn{font-size:14px}.cend{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.cend .price{font-size:15px}
.lnote{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mu);margin-top:2px}.lnote.green{color:var(--gr);font-weight:700}.lnote svg{width:13px;height:13px;stroke-width:2.2}
.hintbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--grs);color:var(--gr)}
.hintbox>svg{width:18px;height:18px;stroke-width:2.2;margin-top:1px}.hintbox b{font-size:13px}
.hintbox .bar{background:rgba(18,122,62,.16);height:6px;margin-top:7px}.hintbox .bar i{background:var(--gr)}
.summary{gap:0}.srow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0}.srow>span:last-child{text-align:right}
.srow.green{color:var(--gr)}.srow.total{font-family:var(--disp);font-weight:800;font-size:18px}.sline{height:1px;background:var(--line);margin:8px 0}
.paylist{display:flex;flex-direction:column;gap:8px}
.paybox{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.paybox:has(input:checked){border:2px solid var(--p);padding:11px}
.paybox input{accent-color:var(--p);width:18px;height:18px;margin:0;flex:none}
.pico{color:var(--mu);display:flex}.pico svg{width:22px;height:22px}.paybox:has(input:checked) .pico{color:var(--p)}
.paybox b{display:block;font-size:14px}.paybox .small{display:block;font-size:12px;line-height:1.4;margin-top:1px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mu)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);resize:vertical;outline:none;font-size:15px;color:var(--ink)}
.warn{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ors);color:var(--or);font-size:13px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;border:0;background:var(--p);color:#fff;font-weight:800;font-size:15px;text-decoration:none;min-height:46px}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}.btn.out{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:11px}.btn.sm svg{width:15px;height:15px}
.btn:disabled{opacity:.5}.btn.green{background:var(--gr)}.btn.done{background:var(--grs);color:var(--gr)}
.btn.big{min-height:56px;border-radius:16px;font-size:16px;justify-content:space-between;padding:0 20px;box-shadow:0 8px 20px rgba(215,20,26,.28)}
.btn.big:disabled{box-shadow:none}

/* done */
.center.done{gap:12px}.bigno{font-size:16px}
.okline{display:inline-flex;align-items:center;gap:6px;color:var(--gr);font-weight:700;font-size:13.5px}.okline svg{width:16px;height:16px;stroke-width:2.4}
.qr{text-align:center;align-items:center}.qr .lbl{align-self:stretch}.qr img{max-width:220px;width:100%;border-radius:12px}

/* me */
.seg{display:flex;padding:4px;gap:4px;border-radius:13px;background:var(--segbg)}
.seg button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;color:var(--mu);font-weight:700;font-size:13.5px;padding:0 4px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.acct{border-radius:calc(var(--r) + 2px);padding:16px;background:var(--card);box-shadow:var(--sh);border:var(--bd);display:flex;flex-direction:column;gap:14px}
.th-b .acct{background:var(--hbg);color:#fff;border:0}
.arow{display:flex;align-items:center;gap:12px}.arow b{font-size:15px}.amu{color:var(--mu)}.th-b .amu{color:var(--hmu)}
.aic{width:44px;height:44px;border-radius:50%;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center;flex:none}.aic svg{width:22px;height:22px}
.chipst{padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}.chipst.green{background:var(--grs);color:var(--gr)}.chipst.amber{background:var(--ors);color:var(--or)}
.astats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.astats div{display:flex;flex-direction:column;gap:2px;min-width:0}.astats b{font-family:var(--disp);font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astats span{font-size:11.5px;color:var(--mu);font-weight:600}.th-b .astats span{color:var(--hmu)}
.redv{color:var(--p)}.greenv{color:var(--gr)}.th-b .greenv{color:#6EE7A0}.th-b .redv{color:#FF7B7F}
.ord{cursor:pointer;gap:8px}.orow{display:flex;gap:12px;align-items:center}.orow .row+.row{margin-top:2px}.orow .price{font-size:15px}
.oic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}.oic svg{width:20px;height:20px;stroke-width:2}
.oic.amber,.stt.amber{background:var(--ors);color:var(--or)}.oic.blue{background:var(--bls);color:var(--bl)}.oic.green{background:var(--grs);color:var(--gr)}.oic.violet{background:var(--vis);color:var(--vi)}.oic.grey{background:var(--bg);color:var(--mu)}
.stt{font-weight:700;background:none!important}.stt.blue{color:var(--bl)}.stt.green{color:var(--gr)}.stt.violet{color:var(--vi)}.stt.grey{color:var(--mu)}
.owe1{padding-left:54px}
.items{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}.items .btn{margin-top:4px}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--bg);white-space:nowrap}
.p-pending{background:var(--ors);color:var(--or)}.p-approved,.p-packed,.p-delivering{background:var(--bls);color:var(--bl)}.p-delivered{background:var(--vis);color:var(--vi)}
.p-paid{background:var(--grs);color:var(--gr)}.p-cancelled,.p-returned{background:var(--ps);color:var(--p)}
.kv{justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.kv>span:last-child{text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 6px}.stats div{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:15px;color:var(--ink);font-family:var(--disp)}.stats span{font-size:11.5px;color:var(--mu)}
.welcome{padding:10px 12px;border-radius:12px;background:var(--card);font-size:14px;line-height:1.5}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lookopt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left}
.lookopt.on{border:2px solid var(--p);padding:9px}.lookopt b{font-size:14px;margin-top:4px}
.lookprev{width:100%;height:64px;border-radius:10px;display:flex;flex-direction:column;gap:5px;padding:7px;overflow:hidden}
.lookprev i{display:block;border-radius:5px}
.lp-a{background:#F4F4F6;border:1px solid #E6E6EA}.lp-a i:nth-child(1){height:12px;background:#fff}.lp-a i:nth-child(2){height:18px;background:#fff;width:70%}.lp-a i:nth-child(3){height:10px;width:40%;background:#D7141A}
.lp-b{background:#EEEDEA}.lp-b i:nth-child(1){height:16px;background:#131316;margin:-7px -7px 0;border-radius:0 0 8px 8px}.lp-b i:nth-child(2){height:16px;background:#fff;width:70%}.lp-b i:nth-child(3){height:10px;width:40%;background:#E3161D}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--tbg);border-top:1px solid var(--line);padding:7px 4px calc(8px + env(safe-area-inset-bottom));z-index:6}
.th-b .tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));border:0;border-radius:24px;padding:7px 4px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media(min-width:792px){.tabs{max-width:760px;margin:0 auto}.th-b .tabs{max-width:736px}}
.tabs button{flex:1;border:0;background:none;padding:3px 0 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--tink);min-width:0}
.tabs .tl2{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tabs .ic{position:relative;width:50px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .15s}
.tabs .ic svg{width:22px;height:22px;stroke-width:1.8}
.tabs button.on{color:var(--ton);font-weight:800}.tabs button.on .ic{background:var(--tonbg);color:var(--tonic)}.tabs button.on .ic svg{stroke-width:2.2}
.tabs button:active .ic{transform:scale(.92)}
.badge{position:absolute;top:-4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--p);color:#fff;border:2px solid var(--tbg);font-style:normal;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.th-b .tabs button.on .badge{background:#fff;color:var(--p)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#131316;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* forms (register, my shop, pre-order) */
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--mu)}
.form input,.form select,.form textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:400;outline:none;-webkit-appearance:none;appearance:none}
.form input:focus,.form select:focus,.form textarea:focus,.search:focus-within{border-color:var(--ink)}
.gpsbox{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.gpsbox b{font-size:14px;color:var(--ink)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}.radio input{accent-color:var(--p);width:18px;height:18px;margin-top:2px;flex:none}
.prebox{gap:6px}.tbbtn{background:#FF5000}
.how{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
.prephoto{width:64px;height:64px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--mu)}.prephoto img{width:100%;height:100%;object-fit:cover}
.prethumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.tl{display:flex;gap:4px;flex-wrap:wrap}.tl span{font-size:11px;padding:3px 7px;border-radius:8px;background:var(--bg);color:var(--mu);font-weight:700}.tl .d{background:var(--grs);color:var(--gr)}.tl .c{background:var(--p);color:#fff}
.card.pre{gap:8px}.card.pre a{display:inline-flex;align-items:center;gap:4px}.card.pre a svg{width:14px;height:14px}
.inp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);min-width:0;color:inherit}
.cic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:var(--ps);color:var(--p);flex:none}.cic svg{width:24px;height:24px}

/* chat */
main.chatmain{padding-bottom:176px;gap:8px}
.chathead{gap:10px}.chathead .cic{width:40px;height:40px}
.chatlist{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.cday{align-self:center;font-size:11.5px;font-weight:700;color:var(--mu);background:var(--card);border-radius:999px;padding:3px 10px;margin:6px 0}
.cm{align-self:flex-start;max-width:80%;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:7px 11px 5px;font-size:14.5px;line-height:1.45;word-break:break-word}.cm .ctx{white-space:pre-wrap}
.cm.me{align-self:flex-end;background:var(--p);color:#fff;border-color:var(--p);border-radius:16px 16px 5px 16px}
.th-b .cm.me{background:#131316;border-color:#131316}
.cm img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin:2px 0 4px}
.cwho{font-size:11.5px;font-weight:800;color:var(--p);margin-bottom:1px}
.ctm{display:block;text-align:right;font-size:10.5px;opacity:.65;margin-top:1px}
.chatbar{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:5px;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.10)}
.th-b .chatbar{bottom:calc(92px + env(safe-area-inset-bottom))}
.chatbar textarea{flex:1;border:0;outline:none;background:none;resize:none;padding:9px 6px;max-height:110px;font-size:15px;line-height:1.35}
.cbtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--mu);display:flex;align-items:center;justify-content:center}
.cbtn.send{background:var(--p);color:#fff}.cbtn:disabled{opacity:.5}.cbtn svg{width:21px;height:21px}

/* picture guide */
.gpic{align-self:center;width:min(250px,70vw);border-radius:20px;overflow:hidden;border:6px solid #16161a;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.gpic img{display:block;width:100%}
.gsteps{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:9px;line-height:1.55;font-size:15px}
.gsteps li::marker{font-weight:800;color:var(--p)}
.gitem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.gitem:last-child{border-bottom:0}.gitem b{display:block;font-size:14.5px}.gitem .small{display:block;margin-top:1px}.gitem svg{width:20px;height:20px}
.guidecard{background:var(--bls,#E6EDFF);border:0}.guidecard .rico{background:#fff;color:#1D4ED8}
/* sliding banners (admin web: Staff banners → Telegram shop) */
.sbn{position:relative;border-radius:calc(var(--r) + 4px);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.sbn-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sbn-track::-webkit-scrollbar{display:none}
.sbn-s{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:12/5;min-height:128px;border:0;padding:0;margin:0;font:inherit;color:#fff;text-align:left;cursor:pointer;overflow:hidden;display:block}

        <div class="stats"><div><b>${st.orders || 0}</b><span>${esc(T.ordersN)}</span></div><div><b>${money(st.bought)}</b><span>${esc(T.bought)}</span></div><div><b>${money(st.bought_month)}</b><span>${esc(T.boughtM)}</span></div></div>
        ${kv(T.toPay, `<b class="${+st.owed > 0 ? 'red' : ''}">${money(st.owed)}</b>`)}${+st.overdue > 0 ? kv(T.overdue, `<b class="red">${money(st.overdue)}</b>`) : ''}
        ${kv(T.paidAll, money(st.paid_total))}${kv(T.lastOrder, esc(fmtDay(st.last_order)))}
        ${+st.owed > 0 ? `<button class="btn out block" data-tab="orders" style="margin-top:6px">${IC.receipt}${esc(T.orders)}</button>` : ''}</div>
      ${(prof.reward_history || []).length ? `<div class="card">${hd('coins', T.rwHist)}${kv(T.moneyBack, `<b class="okc">${money(prof.reward_credit)}</b>`)}
        ${prof.reward_history.map(h => `<div class="row small kv"><span>${esc(fmtDay(h.at))} · ${esc(T.rwKind[h.kind] || h.kind)}${h.order_no ? ' ' + esc(h.order_no) : ''}${h.kind === 'earned' && h.bought ? ' · ' + money(h.bought) : ''}</span><b class="${+h.amount > 0 ? 'okc' : 'muted'}">${+h.amount > 0 ? '+' : ''}${money(h.amount)}</b></div>`).join('')}</div>` : ''}
      <div class="card">${hd('wallet', T.payments)}
        ${(prof.payments || []).map(p => `<div class="row small kv"><span>${esc(fmtDay(p.at))} · ${esc(String(p.method || '').toUpperCase())}${p.order_no ? ' · ' + esc(T.forOrder(p.order_no)) : ''}</span>
          <span><b>${money(p.amount)}</b> <span class="${p.status === 'confirmed' ? 'okc' : 'muted'}">${esc(T.pst[p.status] || p.status)}</span></span></div>`).join('') || `<p class="small muted" style="margin:0">${esc(T.noPay)}</p>`}</div>
      <div class="card">${hd('users', T.people)}
        ${(prof.people || []).map(x => `<div class="small kv">• ${esc(x.name || 'Telegram')}${x.username ? ' <span class="muted">@' + esc(x.username) + '</span>' : ''}${x.me ? ' <b>(' + esc(T.you) + ')</b>' : ''}</div>`).join('')}
        <div class="row small kv" style="margin-top:6px"><span class="iconl">${IC.bell}${esc(T.notif)}</span>${S.me.can_message ? `<b class="okc">${esc(T.on)}</b>` : `<button class="btn sm out" id="notify">${esc(T.turnOn)}</button>`}</div></div>`;
  }
  async function loadProfile() { try { prof = await rpc('shop_profile'); } catch (e) { prof = { shop: S.shop, stats: S.balance, payments: [], people: [] }; toast(e.message); } if (tab === 'me') draw(); }
  function bindMe() {
    root.querySelectorAll('[data-look]').forEach(b => b.onclick = () => { look = b.dataset.look; store.set('kts_look', look); applyLook(); haptic(); draw(); });
    const E = document.getElementById('edit'); if (E) E.onclick = () => { editing = true; EDIT = null; draw(); };
    const WO = document.getElementById('waitok'); if (WO) WO.onclick = () => { justSent = false; window.scrollTo(0, 0); draw(); };
    if (!editing) return;
    ['eo', 'ep', 'ea'].forEach(id => { const el = document.getElementById(id); if (el) el.oninput = () => { EDIT[{ eo: 'owner', ep: 'phone', ea: 'area' }[id]] = el.value; }; });
    const C = document.getElementById('ecancel'); if (C) C.onclick = () => { editing = false; EDIT = null; draw(); };
    const L = document.getElementById('eloc'); if (L) L.onclick = () => {
      const x = document.getElementById('elx'); x.className = 'small muted'; x.textContent = t().gpsWait;
      getLocation((a, o) => { EDIT.lat = a; EDIT.lng = o; x.className = 'small okc'; x.textContent = t().gpsOk; haptic(); },
                  () => { x.textContent = t().locFail; toast(t().locFail); });
    };
    const B = document.getElementById('esave'); if (B) B.onclick = async () => {
      if (!EDIT.owner.trim()) return toast(t().yourName + ' ?'); if (!EDIT.phone.trim()) return toast(t().phone + ' ?');
      B.disabled = true;
      try { prof = await rpc('shop_update_profile', { p: { owner: EDIT.owner.trim(), phone: EDIT.phone.trim(), area: EDIT.area.trim(), lat: EDIT.lat, lng: EDIT.lng } });
        editing = false; EDIT = null; justSent = !!prof.pending_change; haptic('ok'); window.scrollTo(0, 0); draw(); }
      catch (e) { toast(e.message); B.disabled = false; }
    };
  }

  async function loadOrders() { try { [orders, PRE] = await Promise.all([rpc('shop_orders'), rpc('shop_preorders').catch(() => [])]); } catch (e) { orders = []; toast(e.message); } if (tab === 'orders' || tab === 'preorders') draw(); }

  // ---------- actions ----------
  function setQty(id, q) {
    const p = products.find(x => String(x.id) === String(id)); if (!p) return;
    q = Math.max(0, Math.floor(+q || 0));
    if (q > 100000) q = 100000;
    if (q) cart[p.id] = q; else delete cart[p.id];
    saveCart(); haptic(); draw();
  }
  function bind() {
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { const was = tab; tab = b.dataset.tab; if (tab === 'orders' || tab === 'preorders') { orders = null; PRE = null; } if (tab === 'me') { prof = null; editing = false; justSent = false; }
      if (tab === 'products' && was === 'products' && b.closest('.tabs')) { cat = ''; search = ''; } if (tab === 'chat' && was !== 'chat') CHAT = null; window.scrollTo(0, 0); draw(); });
    if (tab === 'me') bindMe();
    if (tab === 'pre' || tab === 'orders' || tab === 'preorders') bindPre();
    const L = document.getElementById('lang'); if (L) L.onclick = () => { lang = lang === 'km' ? 'en' : 'km'; store.set('kts_lang', lang); draw(); };
    const Q = document.getElementById('q'); if (Q) Q.oninput = e => { search = e.target.value; const pos = e.target.selectionStart; draw(); const n = document.getElementById('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} };
    root.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { cat = b.dataset.cat; draw(); });
    root.querySelectorAll('[data-guide]').forEach(b => b.onclick = () => { guideSel = b.dataset.guide || null; tab = 'guide'; window.scrollTo(0, 0); draw(); });
    root.querySelectorAll('[data-add]').forEach(b => b.onclick = () => setQty(b.dataset.add, 1));
    root.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => setQty(b.dataset.inc, (cart[b.dataset.inc] || 0) + 1));
    root.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => setQty(b.dataset.dec, (cart[b.dataset.dec] || 0) - 1));
    root.querySelectorAll('[data-qty]').forEach(i => i.onchange = () => setQty(i.dataset.qty, i.value));
    root.querySelectorAll('input[name=pm]').forEach(r => r.onchange = () => { payMode = r.value; });
    const N = document.getElementById('note'); if (N) N.oninput = e => { note = e.target.value; };
    const B = document.getElementById('send'); if (B) B.onclick = send;
    const NT = document.getElementById('notify'); if (NT) NT.onclick = askUpdates;
    const CH = document.getElementById('chatnow'); if (CH) CH.onclick = openChat;
    root.querySelectorAll('[data-ask]').forEach(b => b.onclick = e => { e.stopPropagation(); openChat(); });
    root.querySelectorAll('[data-o]').forEach(c => c.onclick = e => { if (e.target.closest('[data-again],[data-ask]')) return; openOrder = openOrder === +c.dataset.o ? null : +c.dataset.o; draw(); });
    root.querySelectorAll('[data-again]').forEach(b => b.onclick = () => {
      const o = orders.find(x => x.id === +b.dataset.again); let added = 0;
      (o.items || []).filter(i => +i.price > 0).forEach(i => { const p = products.find(x => x.name === i.name); if (p) { cart[p.id] = Math.min(maxPaid(p), (cart[p.id] || 0) + i.qty); added++; } });
      saveCart(); toast(t().addedCart); tab = 'cart'; draw(); });
  }
  function mainButton() {
    if (!TG || !TG.MainButton || DEMO) return;
    const MB = TG.MainButton, Q = quoteNow(), tot = Q ? +Q.total : cartTotal(), sub = Q ? +Q.subtotal : cartTotal(), min = +S.settings.min_order || 0;
    MB.offClick(send); MB.offClick(goCart);
    if (tab === 'cart' && cartLines().length && !(min && sub < min)) { MB.setText(Q ? t().send + ' · ' + money(tot) : t().calc); MB.onClick(send); MB.show(); try { Q ? MB.enable() : MB.disable(); } catch (e) {} }
    else if (tab === 'products' && cartCount()) { MB.setText(t().cart + ' (' + cartCount() + ') · ' + money(tot)); MB.onClick(goCart); MB.show(); MB.enable(); }
    else MB.hide();
  }
  function goCart() { tab = 'cart'; draw(); }
  async function send() {
    if (busy) return; const lines = cartLines(); if (!lines.length) return;
    busy = true; const B = document.getElementById('send'); if (B) { B.disabled = true; B.textContent = t().sending; }
    if (TG && TG.MainButton && !DEMO) TG.MainButton.showProgress();
    try {
      lastOrder = await rpc('shop_place_order', { p_items: lines.map(l => ({ product_id: l.p.id, qty: l.q })), p_payment: payMode, p_note: note || null });
      cart = {}; note = ''; saveCart(); haptic('ok');
      products = await rpc('shop_catalog').catch(() => products);
      S.balance.waiting = (+S.balance.waiting || 0) + 1;
      rpc('shop_start').then(x => { if (x && x.offers) S.offers = x.offers; }).catch(() => {});   // e.g. the first-order offer is used now
      tab = 'done'; draw();
      if (lastOrder.pay_choice === 'chat') setTimeout(openChat, 600);
    } catch (e) { toast(e.message); if (B) { B.disabled = false; B.textContent = t().send; } }
    finally { busy = false; if (TG && TG.MainButton && !DEMO) TG.MainButton.hideProgress(); }
  }
  function askUpdates() {
    const done = ok => { if (!ok) return; S.me.can_message = true; if (prof) prof.can_message = true; rpc('shop_set_notify', { p_on: true }).catch(() => {}); draw(); };
    if (TG && TG.requestWriteAccess && !DEMO) { try { TG.requestWriteAccess(done); return; } catch (e) {} }
    done(true);
  }
  if (TG && TG.BackButton) { TG.BackButton.onClick(() => { tab = 'products'; draw(); }); }
  const _draw = draw; draw = function () { _draw(); if (TG && TG.BackButton && !DEMO) { tab === 'products' ? TG.BackButton.hide() : TG.BackButton.show(); } };
  start();
})();
</script>
</body>
</html>
